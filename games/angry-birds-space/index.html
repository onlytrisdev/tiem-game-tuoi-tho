<!DOCTYPE html>

<html>



<head>

    <meta charset="UTF-8" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

    <title>Angry Birds Space</title>

<script src="../../assets/vendor/clean-runtime.js?v=4"></script>

   



    <!-- Allow fullscreen mode on iOS devices. (These are Apple specific meta tags.) -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    

    <meta name="HandheldFriendly" content="true" />



    <!-- Chrome for Android web app tags -->

    <meta name="mobile-web-app-capable" content="yes" />

  



    <!-- All margins and padding must be zero for the canvas to fill the screen. -->

    <style type="text/css">

        * {

            padding: 0;

            margin: 0;

        }



        html,

        body {

            background: #000;

            color: #fff;

            overflow: hidden;

            touch-action: none;

            -ms-touch-action: none;

        }



        canvas {

            touch-action-delay: none;

            touch-action: none;

            -ms-touch-action: none;

        }



        #gv-hud-actions {

            position: fixed;

            top: 0;

            left: 0;

            z-index: 9999;

            display: none;

            flex-direction: row;

            align-items: center;

            gap: 6px;

            transform-origin: bottom left;

            pointer-events: none;

            user-select: none;

            -webkit-user-select: none;

            -moz-user-select: none;

            -ms-user-select: none;

            -webkit-touch-callout: none;

        }



        #gv-send-score-btn,

        #gv-reset-data-btn {

            pointer-events: auto;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 2px;

            padding: 4px 6px;

            border: none;

            background: transparent;

            border-radius: 8px;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            user-select: none;

            -webkit-user-select: none;

            transition: transform 0.22s ease;

            transform: translateY(0);

        }



        #gv-send-score-btn:hover,

        #gv-reset-data-btn:hover { transform: translateY(-5px); }

        #gv-send-score-btn:active,

        #gv-reset-data-btn:active { transform: translateY(-2px); opacity: 0.9; }



        #gv-send-score-btn img,

        #gv-reset-data-btn img {

            user-select: none;

            -webkit-user-select: none;

            -webkit-touch-callout: none;

        }



        #gv-send-score-btn img,

        #gv-reset-data-btn img {

            width: 92px;

            height: 80px;

            display: block;

            object-fit: contain;

            pointer-events: none;

            -webkit-user-drag: none;

        }



        #gv-reset-modal {

            display: none;

            position: fixed;

            z-index: 10000;

            left: 0;

            top: 0;

            right: 0;

            bottom: 0;

            background: rgba(0, 0, 0, 0.55);

            align-items: center;

            justify-content: center;

            padding: 16px;

        }



        #gv-reset-modal .gv-reset-card {

            max-width: 420px;

            width: 100%;

            background: #fff;

            color: #111;

            border-radius: 12px;

            padding: 20px 18px 16px;

            font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", "Segoe UI", Tahoma, sans-serif;

            text-align: center;

        }



        #gv-reset-modal p {

            margin: 0 0 10px;

            font-size: 18px;

            font-weight: 700;

            line-height: 1.35;

        }



        #gv-reset-modal .gv-reset-actions {

            display: flex;

            gap: 10px;

            justify-content: center;

            margin-top: 14px;

        }



        #gv-reset-confirm,

        #gv-reset-cancel {

            min-width: 120px;

            min-height: 44px;

            border: none;

            border-radius: 8px;

            color: #fff;

            font-family: "Segoe UI", Tahoma, sans-serif;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

        }



        #gv-reset-confirm { background: #d32f2f; }

        #gv-reset-cancel { background: #1565c0; }

        #gv-reset-confirm:disabled { opacity: 0.55; cursor: default; }

    </style>





</head>



<body>

    <div id="fb-root"></div>



    <script>

            if (window.location.protocol.substr(0, 4) === "file") {

                alert("Exported games won't work until you upload them. (When running on the file:/// protocol, browsers block many features from working for security reasons.)");

            }

        })();

    </script>



    <!-- The canvas must be inside a div called c2canvasdiv -->

    <div id="c2canvasdiv">



        <!-- The canvas the project will render to.  If you change its ID, don't forget to change the

		ID the runtime looks for in the jQuery events above (ready() and cr_sizeCanvas()). -->

        <canvas id="c2canvas" width="1280" height="720">

			<!-- This text is displayed if the visitor's browser does not support HTML5.

			You can change it, but it is a good idea to link to a description of a browser

			<a href="http://www.mozilla.com/firefox/">Mozilla Firefox</a><br/>

			<a href="http://www.google.com/chrome/">Google Chrome</a><br/>

			<a href="http://www.apple.com/safari/download/">Apple Safari</a></h1>

    <div id="gv-hud-actions">

        <button type="button" id="gv-send-score-btn" title="Gửi điểm" aria-label="Gửi điểm">

            <img src="save-score.png" alt="" width="92" height="80" draggable="false">

        </button>

        <button type="button" id="gv-reset-data-btn" title="Xóa dữ liệu" aria-label="Xóa dữ liệu">

            <img src="reset-data.png" alt="" width="92" height="80" draggable="false">

        </button>

    <div id="gv-reset-modal" role="dialog" aria-modal="true" aria-labelledby="gv-reset-title">

        <div class="gv-reset-card">

            <p id="gv-reset-title">Bạn có chắc chắn xóa không?</p>

            <p>Mọi dữ liệu sẽ bị xóa vĩnh viễn và không thể khôi phục.</p>

            <div class="gv-reset-actions">

                <button type="button" id="gv-reset-cancel">Hủy</button>

                <button type="button" id="gv-reset-confirm">Xác nhận</button>

            </div>

        </div>

    </div>



    <!-- Pages load faster with scripts at the bottom -->



    <!-- Construct 2 exported games require jQuery. -->

    <script src="jquery-3.4.1.min.js"></script>







    <!-- The runtime script.  You can rename it, but don't forget to rename the reference here as well.

    This file will have been minified and obfuscated if you enabled "Minify script" during export. -->

    <script src="c2runtime.js"></script>

    <script src="arcade-save.js?2"></script>



    <script>

        // Cloud seed must finish (or time out) before the Construct runtime reads localforage.

        jQuery(document).ready(function() {

            var booted = false;

            function bootRuntime() {

                if (booted) return;

                booted = true;

                cr_createRuntime("c2canvas");

                if (window.ArcadeSave && ArcadeSave.bindUi) ArcadeSave.bindUi();

            }

            var watchdog = setTimeout(bootRuntime, 5000);

            var start = (window.ArcadeSave && ArcadeSave.init) ? ArcadeSave.init() : Promise.resolve();

            Promise.resolve(start).then(function() {

                clearTimeout(watchdog);

                bootRuntime();

            }, function() {

                clearTimeout(watchdog);

                bootRuntime();

            });

        });



        // Pause and resume on page becoming visible/invisible

        function onVisibilityChanged() {

            if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)

                cr_setSuspended(true);

            else

                cr_setSuspended(false);

        };



        document.addEventListener("visibilitychange", onVisibilityChanged, false);

        document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);

        document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);

        document.addEventListener("msvisibilitychange", onVisibilityChanged, false);



        function OnRegisterSWError(e) {

            console.warn("Failed to register service worker: ", e);

        };



        // Runtime calls this global method when ready to start caching (i.e. after startup).

        // This registers the service worker which caches resources for offline support.

        window.C2_RegisterSW = function C2_RegisterSW() {

            if (!navigator.serviceWorker)

                return; // no SW support, ignore call



            try {

                navigator.serviceWorker.register("", {

                        scope: "./"

                    })

                    .then(function(reg) {

                        console.log("Registered service worker on " + reg.scope);

                    })

                    .catch(OnRegisterSWError);

            } catch (e) {

                OnRegisterSWError(e);

            }

        };

    </script>
