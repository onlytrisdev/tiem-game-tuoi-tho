<!DOCTYPE html>

<html lang="en">

    <head>

        <meta http-equiv="X-UA-Compatible" content="IE=edge" />

        <meta http-equiv="pragma" content="no-cache"/>

        <meta name="apple-mobile-web-app-capable" content="yes" />

        <meta name ="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />

        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

        <meta charset="utf-8"/>



        <!-- Set the title bar of the page -->

        <title>Bacon chiến đấu</title>

		<script src="../../assets/vendor/clean-runtime.js?v=4"></script>

		

        <script src="arcade-poki-shim.js"></script>

		<script src="arcade-save.js?v=4"></script>

		<script></script>

        

        <script>var adsAreDisabled = true;</script>

        <!-- Removed legacy prebid interstitials. -->

        <style>

            html {

                height: 100%;

                width: 100%;

            }

            

            body {

              background: #f3c2b5;

              color:#cccccc;

              margin: 0px;

              padding: 0px;

              border: 0px;

			  overflow:hidden;

                

              height:100%;

			  

			  background-color:#191923;

                

              //background-image: url('html5game/wolf.gif');

			  background-image: url('html5game/bg.jpg');

              background-repeat: repeat-x;

              background-position: center center;

			  background-size:0 0;

            }

			

			#bar {

				position:fixed;

				height:56%;

				width:5px;

				

				top:0;

				left:0;

				right:0;

				

				margin:0 auto;

				padding:3px;

				background:#191923;

				background-color:rgba(25, 25, 35, 0.5);

				z-index:-9999;

			}

			

			img#spider  {

				position:absolute;			

				left:-67px;

				bottom:-30px;



			}

			

			#fill {

				position:relative;

				height:1%;

				background:#a4a6b5;

				width:5px;

				margin:0px;

			}

            			

			

			img.torch {

				position:fixed;

				height:128px;

				width:128px;

				top:30%;

				background:url('html5game/tbg.png') 50% 50% no-repeat;

				background-size: 128px;

			}	

			

			



			

			#t1 {

				left:20%;

			}

			

			#t2 {

				right:20%;

			}

			

			img#door {

				position:fixed;

				top:35%;

				left:0;

				right:0;				

				margin:0 auto;

				z-index:10;		

				display:none;				

			}

			



            canvas {

				  image-rendering: optimizeSpeed;

				  -webkit-interpolation-mode: nearest-neighbor;

				  -ms-touch-action: none;

				  margin: 0px;

				  padding: 0px;

				  border: 0px;

				  display:none;

            }

			

			#canvas, canvas {

				-webkit-tap-highlight-color: transparent;

				-webkit-touch-callout: none;

				-webkit-user-select: none;

				-khtml-user-select: none;

				-moz-user-select: none;

				-ms-user-select: none;

				user-select: none;

			}			

            

            :-webkit-full-screen #canvas {

                 width: 100%;

                 height: 100%;

            }

			

            div.gm4html5_div_class {

              margin: 0px;

              padding: 0px;

              border: 0px;

            }

			





        /* Arcade actions: fixed to the real canvas' left-center, only on main menu. */

        #gv-bacon-actions {

            position: fixed; display: none; align-items: center; flex-direction: column;

            gap: 8px; transform: translateY(-50%); z-index: 130;

            pointer-events: none; user-select: none; -webkit-user-select: none;

        }

        #gv-bacon-actions button {

            width: var(--gv-action-size, 56px); height: var(--gv-action-size, 56px);

            min-width: 44px; min-height: 44px; padding: 0; border: 0;

            background: transparent; cursor: pointer; pointer-events: auto;

            touch-action: manipulation; -webkit-tap-highlight-color: transparent;

        }

        #gv-bacon-actions img { width: 100%; height: 100%; object-fit: contain;

            pointer-events: none; -webkit-user-drag: none; user-select: none; }

        #gv-bacon-actions button:active { transform: scale(.94); }

        #gv-bacon-reset-modal {

            display: none; position: fixed; inset: 0; z-index: 200;

            background: rgba(0,0,0,.68); align-items: center; justify-content: center;

            font: 16px/1.45 Arial, sans-serif; color: #252525;

        }

        #gv-bacon-reset-modal.open { display: flex; }

        #gv-bacon-reset-panel {

            background: #fff; border-radius: 14px; padding: 22px; margin: 16px;

            max-width: 360px; text-align: center; box-shadow: 0 10px 30px #0006;

        }

        #gv-bacon-reset-panel button { color: white; font-size: 16px; font-weight: 700;

            border: 0; border-radius: 9px; min-height: 44px; min-width: 104px;

            margin: 7px 4px 0; cursor: pointer; }

        #gv-bacon-reset-ok { background: #c73333; }

        #gv-bacon-reset-cancel { background: #218fcb; }

        #gv-bacon-reset-panel button:disabled { opacity: .5; cursor: wait; }

        #gv-bacon-reset-status { min-height: 1em; font-size: 13px; color: #9e2e2e; }

        </style>

    </head>



    <body id="body">



        <div id="gv-bacon-actions" role="group" aria-label="Arcade">

            <button id="gv-bacon-reset" type="button" title="Xóa dữ liệu" aria-label="Xóa dữ liệu">

                <img src="reset-data.png" alt="" draggable="false" />

            </button>

            <button id="gv-bacon-score" type="button" title="Gửi điểm" aria-label="Gửi điểm">

                <img src="save-score.png" alt="" draggable="false" />

            </button>

        </div>

        <div id="gv-bacon-reset-modal" role="dialog" aria-modal="true" aria-label="Xóa dữ liệu">

            <div id="gv-bacon-reset-panel">

                <p>Bạn có chắc chắn xóa không?</p>

                <p>Mọi dữ liệu sẽ bị xóa vĩnh viễn và không thể khôi phục.</p>

                <div>

                    <button id="gv-bacon-reset-ok" type="button">Xác nhận</button>

                    <button id="gv-bacon-reset-cancel" type="button">Hủy</button>

                </div>

                <p id="gv-bacon-reset-status" aria-live="polite"></p>

            </div>

        </div>



        <div class="gm4html5_div_class" id="gm4html5_div_id">

            <!-- Create the canvas element the game draws to -->

            <canvas id="canvas" width="1024" height="576">

               <p>Your browser doesn't support HTML5 canvas.</p>

            </canvas>

			<script type="text/javascript" src="html5game/BaconMayDie.js"></script>

        </div>

		<div id="bar"><div id="fill"><img id="spider" alt="" src="html5game/spider.png"/></div></div>

	

		<div id="decor">

			

			<img class="torch" id="t1" src="html5game/torch.gif" alt=""/>

			<img class="torch" id="t2" src="html5game/torch.gif" alt=""/>			

			<img id="door" alt="" src="html5game/door.png"/>			

		</div>		

		

		<script>

		var sdk 		= PokiSDK;

		var pokiDebug 	= false;

        var canvas      = document.getElementById("canvas");

		var body 		= document.getElementById("body");

		var bar 		= document.getElementById("bar");

		var fill 		= document.getElementById("fill");



		var decor 		= document.getElementById("decor");		



		var fakeCent		= 1;	

		var fakeCentTarget 	= 75;

		var fails			= 0;

		

		function poki_log(t) {

			console.log(t);

		}

            

        function poki_debug() {

            return pokiDebug;

        }

		

		function poki_loading(progress) {

			fakeCentTarget = Math.max(fakeCentTarget, progress * 100);

			sdk.gameLoadingProgress({percentageDone: progress * 0.9});

			

			if (progress == 1) {

				setTimeout(function () {

                    clearInterval(fakeLoading);

					bar.style.display 		= "none";		

					decor.style.display		= "none";

					canvas.style.display 	= "block";

				}, 1000);

			}

		}

		

		function bar_update(progress) {

			progress = Math.max(fakeCent, progress);

			fill.style.height = progress + "%";

		}

		

		var fakeLoading = setInterval(function() {

				fakeCent = loading_lerp(fakeCent, fakeCentTarget, 0.05);

				bar_update(fakeCent);							

		}, 20);		

		

		

		function gamemaker_start() {

			try {

			  GameMaker_Init();

			} catch(err) {

				fails++;			

				setTimeout(gamemaker_start, 5000);

				if (fails == 1) throw(err);						

			}

		}



		var bgScale = window.innerHeight / 1024;

		body.style.backgroundSize = (512 * bgScale) + "px " + (1024 * bgScale) + "px";

		

		window.onload = function() {

			// Restore GameMaker native INI keys before the runner reads pig.ini.

            Promise.resolve().then(function () { return ArcadeBacon.init(); })

                .catch(function (e) { console.warn("GV_INIT_ERROR", e.message); })

                .then(function () { return sdk.init(); })

                .catch(function () { /* lifecycle shim failure is non-fatal */ })

                .then(function () {

                    sdk.setDebug(pokiDebug);

                    sdk.gameLoadingStart();

                    gamemaker_start();

                });

        

            canvas.width  = window.innerWidth;

            canvas.height = window.innerHeight;

            canvas.addEventListener('click', function(){

                window.focus();

            });           





			//document.getElementById("door").style.top= (300 * bgScale) + "px";

			//document.getElementById("door").style.width = (bgScale * 100) +"%";

			//document.getElementById("door").style.height = (bgScale * 100) +"%";

		}

		

		window.addEventListener('wheel', ev => ev.preventDefault(), { passive: false });

		window.addEventListener('keydown', ev => {

			if (['ArrowDown', 'ArrowUp', ' '].includes(ev.key)) {

				ev.preventDefault();

			}

		});		

            

                

        /// smooth things out 

        function loading_lerp (start, end, amt){

            return (1 - amt) * start + amt * end;

        }

		</script>

    </body>

</html>
