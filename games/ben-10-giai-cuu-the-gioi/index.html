<html lang="en">

<head>

    <meta charset="utf-8"/>

    <meta http-equiv="x-ua-compatible" content="ie=edge">

    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no"/>

    

    <title>Ben 10 Giải cứu thế giới</title>

    

	<script src="../../assets/vendor/jquery-1.9.1.min.js"></script>

	<script src="../../assets/vendor/clean-runtime.js?v=4"></script>

	<script type="text/javascript" src="arcade-tool.js"></script>



    <link rel="stylesheet" href="assets/css/app.css" type="text/css"/>

    <link rel="stylesheet" href="assets/css/loader.css" type="text/css"/>

    <style type="text/css">

      #video_holder, #video_player, .video-js { display: none !important; visibility: hidden !important; pointer-events: none !important; }

    </style>

</head>

<body>

  <div id="game">

    <div id="video_holder" class="video-container" style="display: none !important;" aria-hidden="true">

      <video id="video_player" class="video-js" playsinline preload="none" style="display: none !important; background: black;"></video>

    </div>

  

    <div id="content">

  

      <div id="loader" style="position: absolute; right:0; bottom:0">

        <div class="lds-ring">

          <div></div>

          <div></div>

          <div></div>

          <div></div>

        </div>

      </div>

      

    </div>

  </div>

<div id="dummy" style="position:fixed;right:0;bottom:0"></div>

<div id="orientation"></div>



<script type="text/javascript">



  

  var gameName = "cangrejo-ideas-template.min.js";

  var urlVideo = "assets/video/CNGamesLogo_4-3.mp4";

  var language = "en";

  



  //This all here is for cache busting;

  function addScript(src, buster, callback) {

    var s = document.createElement('script');

    s.setAttribute('src', src + '?v=' + buster);

    if (typeof callback === 'function') {

      s.onload = callback;

    }

    document.body.appendChild(s);

  }



  function startGame() {

    try {

      /* Global Constants — PreloaderState đọc Constants.SHOW_VIDEO */

      if (typeof window.Constants !== 'undefined') {

        window.Constants.SHOW_VIDEO = false;

      }

    } catch (e) { /* ignore */ }



    var boot = function () {

      try {

        if (typeof window.Constants !== 'undefined') {

          window.Constants.SHOW_VIDEO = false;

        }

        if (window.ArcadeTool && typeof ArcadeTool.installHooks === 'function') {

          ArcadeTool.installHooks();

        }

      } catch (e2) { /* ignore */ }

      var g = Game.App.getInstance();

      g.start();

    };



    var ready = (window.ArcadeTool && ArcadeTool.ready) ? ArcadeTool.ready : Promise.resolve();

    var hookWait = (window.ArcadeTool && typeof ArcadeTool.waitAndHook === 'function')

      ? ArcadeTool.waitAndHook(5000)

      : Promise.resolve();



    Promise.all([ready, hookWait]).then(boot).catch(boot);

  }



  addScript('version.js', Date.now(), function () {

    addScript(gameName, version, function () {

      startGame();

    })

  })

</script>



</body>

</html>
