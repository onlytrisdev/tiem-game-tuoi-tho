                'id' : 590,

            });

            CloudAPI.mute = function () {

                if (main.phaserGame && main.phaserGame.sound) {main.phaserGame.sound.mute = true;}

            };

            CloudAPI.unmute = function () {

                if (main.phaserGame && main.phaserGame.sound) { main.phaserGame.sound.mute = false; }

            };
