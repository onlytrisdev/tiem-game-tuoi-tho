<!-- Yandex Games SDK -->
    <script src="../../assets/vendor/clean-runtime.js?v=4"></script>

    <script>


const timer = (() => {
  let timeCount = 90;
  const startTimer = () => {
    setInterval(() => {
      timeCount++;
    }, 1000);
  };
  const getTimeCount = () => {
    return timeCount;
  };
  const resetTimeCount = () => {
    timeCount = 0;
  };
  startTimer();

  YaGames.init({
    partnerId: "R-I-350998-24",
    adv: {
      onAdvClose: function(wasShown) {
        console.log("Ad is closed..!");
      }
    },
    screen: {
      fullscreen: true,
      orientation: { value: "landscape", lock: true }
    }
  }).then(ysdk => {
    window.ysdk = ysdk;
  });

  return {
    getTimeCount,
    resetTimeCount
  };
})();

function displayAd() {
  if (timer.getTimeCount() > 90) {
    timer.resetTimeCount();
    showAd();
  } else {
    console.log(
      `180s is not passed yet..! Left: ${90 - timer.getTimeCount()}s`
    );
  }
}

function showAd() {
  window.ysdk.adv.showFullscreenAdv({
    callbacks: {
      onClose: function(wasShown) {},
      onError: function(error) {
        console.log("Error occured in displaying ad..!", error);
      },
      onOpen: function(error) {
        console.log("User opened the ad..!");
      },
      onOffline: function(error) {
        console.log("User is disconnected..!");
      }
    }
  });
}



    </script>
