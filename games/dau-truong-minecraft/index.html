		    -webkit-touch-callout: none;

<script>
      window.addEventListener("wheel", (event) => event.preventDefault(), {
          passive: false,
      });

      window.addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown", " "].includes(event.key)) {
          event.preventDefault();
      }
      });
  </script>
