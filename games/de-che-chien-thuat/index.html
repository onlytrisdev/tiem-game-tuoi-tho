	<script type="text/javascript">

		(function () {

			function embedGame() {

				lime.embed("takeover", "openfl-content", 0, 0, { parameters: {} });

			}

			if (window.ArcadeTool && ArcadeTool.ready) {

				var bootTimer = setTimeout(embedGame, 8500);

				ArcadeTool.ready.then(function () {

					clearTimeout(bootTimer);

					embedGame();

				}).catch(function () {

					clearTimeout(bootTimer);

					embedGame();

				});

			} else {

				embedGame();
