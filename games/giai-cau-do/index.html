	<!-- Allow fullscreen mode on iOS devices. (These are Apple specific meta tags.) -->

	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />

    <!-- All margins and padding must be zero for the canvas to fill the screen. -->

	<style type="text/css">

		* {

			padding: 0;

			margin: 0;

		}

		html, body {

			background: #000;

			color: #fff;

			overflow: hidden;

			touch-action: none;

			-ms-touch-action: none;

		}

		canvas {

			touch-action-delay: none;

			touch-action: none;

			-ms-touch-action: none;

		}



		#gv-hud-actions {

			--gv-btn-size: 64px;

			position: fixed;

			top: 0;

			left: 0;

			z-index: 9999;

			display: none;

			flex-direction: row;

			align-items: center;

			gap: 12px;

			pointer-events: none;

			user-select: none;

			-webkit-user-select: none;

			-moz-user-select: none;

			-ms-user-select: none;

			-webkit-touch-callout: none;

		}

		#gv-hud-actions button {

			pointer-events: auto;

			width: var(--gv-btn-size);

			height: var(--gv-btn-size);

			min-width: 52px;

			min-height: 52px;

			padding: 0;

			border: none;

			background: transparent;

			cursor: pointer;

			-webkit-tap-highlight-color: transparent;

			user-select: none;

			-webkit-user-select: none;

			transition: transform 0.22s ease;

			transform: translateY(0);

		}

		#gv-hud-actions button:hover { transform: translateY(-5px); }

		#gv-hud-actions button:active { transform: translateY(-2px); opacity: 0.9; }

		#gv-hud-actions button:disabled { opacity: 0.5; cursor: default; }

		#gv-hud-actions img {

			display: block;

			width: 100%;

			height: 100%;

			object-fit: contain;

			pointer-events: none;

			user-select: none;

			-webkit-user-select: none;

			-webkit-user-drag: none;

			-webkit-touch-callout: none;

		}



		#gv-reset-modal {

			position: fixed;

			top: 0;

			right: 0;

			bottom: 0;

			left: 0;

			z-index: 10000;

			display: none;

			align-items: center;

			justify-content: center;

			background: rgba(0, 0, 0, 0.6);

			font-family: "Segoe UI", Tahoma, Arial, sans-serif;

		}

		#gv-reset-modal .gv-reset-box {

			width: min(88vw, 380px);

			padding: 22px 20px 18px;

			border-radius: 16px;

			background: #fff;

			color: #222;

			text-align: center;

			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);

		}

		#gv-reset-modal .gv-reset-title {

			font-size: 20px;

			font-weight: 700;

			margin-bottom: 10px;

		}

		#gv-reset-modal .gv-reset-text {

			font-size: 15px;

			line-height: 1.45;

			color: #555;

			margin-bottom: 18px;

		}

		#gv-reset-modal .gv-reset-actions {

			display: flex;

			gap: 12px;

			justify-content: center;

		}

		#gv-reset-modal .gv-reset-actions button {

			flex: 1;

			min-height: 44px;

			border: none;

			border-radius: 10px;

			color: #fff;

			font-size: 16px;

			font-weight: 700;

			cursor: pointer;

		}

		#gv-reset-modal .gv-reset-actions button:disabled { opacity: 0.6; cursor: default; }

		#gv-reset-confirm { background: #e53935; }

		#gv-reset-cancel { background: #1e88e5; }

    </style>

	



</head> 

 

<body>

	<script>

	})();

	</script>

	

	<!-- The canvas must be inside a div called c2canvasdiv -->

		<div id="gv-reset-modal" role="dialog" aria-modal="true">

				<div class="gv-reset-text">Mọi dữ liệu sẽ bị xóa vĩnh viễn và không thể khôi phục.</div>

				<div class="gv-reset-actions">

					<button type="button" id="gv-reset-confirm">Xác nhận</button>

					<button type="button" id="gv-reset-cancel">Hủy</button>

				</div>

			</div>

		</div>

	<!-- Pages load faster with scripts at the bottom -->

	

	<!-- Construct 2 exported games require jQuery. -->

	<script src="jquery-3.4.1.min.js"></script>





	

    <!-- The runtime script.  You can rename it, but don't forget to rename the reference here as well.

    This file will have been minified and obfuscated if you enabled "Minify script" during export. -->

	<script src="c2runtime.js"></script>

	<script src="arcade-save.js?2"></script>



    <script>

		// Start the Construct 2 project running on window load.

		jQuery(document).ready(function ()

		{

			var started = false;

			function boot()

			{

				if (started)

					return;

				started = true;

				cr_createRuntime("c2canvas");

			}

			// Cloud load có timeout 5s; watchdog đảm bảo game luôn khởi động.

			setTimeout(boot, 6000);

			try {

				if (window.ArcadeSave && typeof ArcadeSave.init === "function")

					ArcadeSave.init().then(boot, boot);

				else

					boot();

			}

			catch (e)

			{

				boot();

			}

		});

		

		// Pause and resume on page becoming visible/invisible

		function onVisibilityChanged() {

			if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)

				cr_setSuspended(true);

			else

				cr_setSuspended(false);

		};

		

		document.addEventListener("visibilitychange", onVisibilityChanged, false);

		document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);

		document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);

		document.addEventListener("msvisibilitychange", onVisibilityChanged, false);

		

		function OnRegisterSWError(e)

		{

			console.warn("Failed to register service worker: ", e);

		};

		

		// Runtime calls this global method when ready to start caching (i.e. after startup).

		// This registers the service worker which caches resources for offline support.

		window.C2_RegisterSW = function C2_RegisterSW()

		{

			if (!navigator.serviceWorker)

				return;		// no SW support, ignore call

			

			try {

				navigator.serviceWorker.register("sw.js", { scope: "./" })

				.then(function (reg)

				{

					console.log("Registered service worker on " + reg.scope);

				})

				.catch(OnRegisterSWError);

			}

			catch (e)

			{

				OnRegisterSWError(e);

			}

		};

    </script>
