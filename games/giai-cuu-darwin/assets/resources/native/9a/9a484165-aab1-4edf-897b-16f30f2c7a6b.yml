# Unlock the nurse
- quest:
  - set_quest_text: open_nurse
  - lock_door: { door: nurse, locked: true}
  - add_character: {type: alan, pos: {room: hw9_library, x: 601, y: 183}}
  - set_character_idle_clip: {clip: LOOP_alan, type: alan}
  - set_character_request: {type: alan, item: blowgun}
  - add_character: { type: penny, pos: { room: nursing, x: -10, y: 212 } }
  - set_character_request: { type: penny, item: padlock }
  - set_character_idle_clip: { clip: LOOP_pennyangry, type: penny }
  - wait: {minigame_done: {room: nursing, name: door_lock_3, id: 0}}
  - enable_player_control: false
  - play_sfx: mission_completed_penny2
  - play_character_animation: { type: penny, clip_list: [ PLAY_celebration, LOOP_penny3 ]}
  - set_quest_text_icon: tick-keep
  - fade_in: 2
  - remove_character: penny
  - fade_out: 1
  - enable_player_control: true
  - set_quest_text_icon: tick-hide
  - save_game

# Poster painting quest
- quest:
  - set_quest_text: open_library
  - force_quest_room: hw9_library
  - add_character: { type: penny, pos: {room: hw6_nurse, x: -330, y: 225}}
  - set_character_idle_clip: {clip: LOOP_penny2, type: penny }
  - start_fiber: { id: text_update_penny, entry_point: text_update_penny }
  - start_fiber: { id: text_update_lock, entry_point: text_update_lock }
  - start_fiber: { id: red_brush, entry_point: red_brush_1 }
  - start_fiber: { id: blue_brush, entry_point: blue_brush_1 }
  - start_fiber: { id: green_brush, entry_point: green_brush_1 }
  - start_fiber: { id: main, entry_point: main }
  - jump: quest_end

  - label: text_update_penny
  # Update text if interacted with Penny
  - wait: { character_interaction: penny }
  - set_quest_text: help_penny_poster
  - force_quest_room: hw6_nurse
  - kill_fiber: text_update_lock
  - end

  - label: text_update_lock
  # Update text if interacted with combination lock
  - wait: { prop_interaction: { room: hw9_library, name: door_lock_2, id: 0 }}
  - set_quest_text: help_penny_poster
  - force_quest_room: hw6_nurse
  - kill_fiber: text_update_penny
  - end

  - label: red_brush_1
  - jump_if_player_has_item: { item: red_brush, label: red_brush_2 }
  # Red brush logic (when Gumball starts the quest without the brush painted)
  - wait: { prop_request_fulfillment: { room: artroom, name: paint_red, id: 0 }}
  - wait: { item_picked_up: red_brush, room: artroom }
  - set_character_request: { type: penny, item: red_brush }
  - wait: { character_request_fulfillment: penny }
  - jump: red_brush_end

  - label: red_brush_2
  # Red brush logic (when Gumball starts the quest having the brush painted)
  - wait: { character_request_fulfillment: penny }
  - jump: red_brush_end

  - label: red_brush_end
  - wait: 2
  - set_environment_flag: { flag: poster_red_painted, enabled: true }
  - end

  - label: blue_brush_1
  - jump_if_player_has_item: { item: blue_brush, label: blue_brush_2 }
  # Blue brush logic
  - wait: { prop_request_fulfillment: { room: artroom, name: paint_blue, id: 0 }}
  - wait: { item_picked_up: blue_brush, room: artroom }
  - set_character_request: { type: penny, item: blue_brush }
  - wait: { character_request_fulfillment: penny }
  - jump: blue_brush_end

  - label: blue_brush_2
  # Blue brush logic (when Gumball starts the quest having the brush painted)
  - wait: { character_request_fulfillment: penny }
  - jump: blue_brush_end

  - label: blue_brush_end
  - wait: 2
  - set_environment_flag: { flag: poster_blue_painted, enabled: true }
  - end

  - label: green_brush_1
  - jump_if_player_has_item: { item: green_brush, label: green_brush_2 }
  # Green brush logic
  - wait: { prop_request_fulfillment: { room: classroom, name: paint_green, id: 0 }}
  - wait: { item_picked_up: green_brush, room: classroom }
  - set_character_request: { type: penny, item: green_brush }
  - wait: { character_request_fulfillment: penny }
  - jump: green_brush_end

  - label: green_brush_2
  # Green brush logic (when Gumball starts the quest having the brush painted)
  - wait: { character_request_fulfillment: penny }
  - jump: green_brush_end

  - label: green_brush_end
  - wait: 2
  - set_environment_flag: { flag: poster_green_painted, enabled: true }
  - end

  - label: on_brush_delivered
  # This happens when you deliver a brush
  - enable_player_control: false
  - fade_in: 2
  - set_player_position: { x: -200, y: 165, direction: left }
  - spawn_item: { type: brush, pos: { room: hw6_nurse, x: -545, y: 175 }}
  - set_character_request: { type: penny, item: painted_brush }
  - fade_out: 1
  - play_sfx: paint_after_fade
  - enable_player_control: true
  - end

  - label: main
  # Delivering brushes to Penny
  - set_character_request: { type: penny, item: painted_brush }
  - wait: { character_request_fulfillment: penny }
  - play_sfx: paint_wall1
  - start_fiber: { id: deliver_1, entry_point: on_brush_delivered }
  - wait: { character_request_fulfillment: penny }
  - play_sfx: paint_wall2
  - start_fiber: { id: deliver_2, entry_point: on_brush_delivered }
  - wait: { character_request_fulfillment: penny }
  - play_sfx: paint_wall3
  - enable_player_control: false
  - set_quest_text_icon: tick-keep
  - fade_in: 2
  - remove_character: penny
  - fade_out: 1
  - play_sfx: paint_after_fade
  - set_quest_text_icon: tick-hide
  - enable_player_control: true
  - set_quest_text: open_library
  - force_quest_room: hw9_library
  - wait: 5
  - save_game
  - end

  - label: quest_end
  # Open the library
  - wait: { minigame_done: { room: hw9_library, name: door_lock_2, id: 0 }}
  - force_quest_room: null
  - set_quest_text_icon: tick
  - set_quest_text: explore_library
  - save_game

# Get tobias out of the library
- quest:
  - add_character: { type: tobias, pos: { room: library_1, x: 147, y: 186 }}
  - set_character_facing_scale: { type: tobias, direction: -1 }
  - set_character_idle_clip: { type: tobias, clip: LOOP_tobias2 }
  - wait: { arrival: library_1 }
  - set_quest_text: tobias_out
  - start_fiber: { id: move_tobias, entry_point: move_tobias }
  - set_prop_blocker: { npc: tobias, blacklist: [{ room: library_2, name: extinguisher, id: 0 }]}
  - jump: main

  - label: move_tobias
  - wait: { arrival: library_2 }
  - add_character: { type: tobias, pos: { room: library_2, x: 108, y: 230 }}
  - set_character_facing_scale: { type: tobias, direction: -1 }
  - wait: { arrival: library_1 }
  - add_character: { type: tobias, pos: { room: library_1, x: 147, y: 186 }}
  - set_character_facing_scale: { type: tobias, direction: -1 }
  - jump: move_tobias

  - label: main
  - force_quest_room: rooftop
  - wait: { prop_request_fulfillment: { room: library_2, name: extinguisher, id: 0 }}
  - give_item: fire_extinguisher
  - wait: { prop_request_fulfillment: { room: rooftop, name: ac, id: 0 }}
  - show_panel: { type: fire_extinguisher }
  - kill_fiber: move_tobias
  - force_quest_room: null
  - clear_prop_blocker
  - remove_character: tobias
  - wait: { arrival: library_1 }
  - set_quest_text_icon: tick
  - set_quest_text: explore_library
  - save_game

# Fix the computer
- quest:
  - wait: { arrival: library_2 }
  - set_quest_text: fix_pc
  - wait: { prop_request_fulfillment: { room: library_2, name: screen, id: 0 }}
  - enable_prop: { prop: { room: library_2, name: screen, id: 1 }}
  - set_quest_text_icon: tick
  - save_game

# Get the password
- quest:
  - jump: main

  - label: alan_popped
  - show_panel: { type: default, image: popping_alan }
  - play_sfx: alan_pop
  - play_character_animation: { type: alan, clip_list: [ PLAY_alan_pop ]}
  - remove_character: alan
  - end

  - label: main
  - set_quest_text: get_password
  - wait: { character_request_fulfillment: alan }
  - start_fiber: { id: alan_popped, entry_point: alan_popped }
  - enable_prop: { prop: { room: hw9_library, name: note, id: 0 }}
  - wait: { minigame_done: { room: hw9_library, name: note, id: 0 }}
  - wait: { prop_request_fulfillment: { room: library_2, name: screen, id: 1 }}
  - show_panel: { type: pc_video_hint }
  - set_environment_flag: { flag: gym_hall_panel_open, enabled: true }
  - enable_prop: { prop: { room: hw2_gym, name: generator, id: 0 }, enabled: false }
  - enable_prop: { prop: { room: hw2_gym, name: generator, id: 1 }}
  - set_quest_text_icon: tick
  - save_game

# Get Mowdown out of the damn way
- quest:
  - set_quest_text: ring_bell
  - wait: { prop_request_fulfillment: { room: hw2_gym, name: generator, id: 2 }}
  - enable_player_control: false
  - show_panel: { type: bell }
  - play_sfx: mowdown_leaves
  - play_character_animation: { type: mowdown, clip_list: [ PLAY_mdn_surprise, PLAY_mdn_leave ]}
  - remove_character: mowdown
  - enable_player_control: true
  - enable_prop: { prop: { room: hw2_gym, name: barrier, id: 0 }}
  - set_quest_text_icon: tick
  - set_quest_text: save_darwin
  - save_game
