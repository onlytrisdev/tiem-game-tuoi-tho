
# First quest
- quest:
  - jump: main

  - label: penny_text
  - set_quest_text: help_penny
  - end

  - label: fulfilling_penny_request
  - wait: { arrival: hw4_classroom, markers: true }
  - lock_door: { door: hw3, locked: true }
  - lock_door: { door: hw4, locked: true }
  - wait: { prop_request_fulfillment: { room: hw4_classroom, name: phone_coin, id: 0 }}
  - wait: { item_picked_up: coin, room: hw4_classroom }
  - lock_door: { door: hw4, locked: false }
  - wait: { arrival: hw5_artroom, markers: true }
  - lock_door: { door: hw4, locked: true }
  - wait: { prop_request_fulfillment: { room: hw5_artroom, name: juice, id: 0 }}
  - wait: { item_picked_up: juice, room: hw5_artroom }
  - lock_door: { door: hw4, locked: false }
  - wait: { arrival: hw4_classroom, markers: true }
  - lock_door: { door: hw4, locked: true }
  - end

  - label: main
  - enable_player_control: false
  - add_character: { type: mowdown, pos: { room: hw2_gym, x: 30, y: 235 } }
  - add_character: { type: penny, pos: { room: hw4_classroom, x: 18, y: 225 } }
  - enable_prop: {prop: {room: hw2_gym, name: generator, id: 0}}
  - enable_prop: {prop: {room: hw3_stairs, name: locker_1, id: 0}}
  - enable_prop: {prop: {room: hw5_artroom, name: vent, id: 0}}
  - enable_prop: {prop: {room: hw5_artroom, name: locker_2, id: 0}}
  - enable_prop: {prop: {room: hw5_artroom, name: door_lock, id: 0}}
  - enable_prop: {prop: {room: hw3_stairs, name: generator, id: 0}}
  - set_character_idle_clip: { clip: LOOP_penny1, type: penny }
  - set_character_request: { type: penny, item: juice }
  - set_quest_text: find_darwin
  - wait: 1.5

  # Tutorial 1
  - show_tutorial: move
  - show_tutorial: objective
  - show_tutorial: room
  - enable_player_control: true

  # Tutorial 2
  - wait: { arrival: hw2_gym, markers: true }
  - lock_door: { door: hw1, locked: true }
  - lock_door: { door: hw2, locked: true }
  - show_tutorial: clues
  - wait: {
      character_interaction: mowdown,
      markers: true
      }
  - lock_door: { door: hw2, locked: false }
  - show_tutorial: gym

  # Tutorial 3:
  - start_fiber: { id: penny_tutorial, entry_point: fulfilling_penny_request }
  - wait: {
      character_request_fulfillment: penny,
      on_first_interaction: penny_text,
      props_of_interest: [
        { room: hw4_classroom, name: "phone_coin", id: 0 },
        { room: hw5_artroom, name: "juice", id: 0 }
      ],
      markers: true
      }
  - play_sfx: mission_completed_penny1
  - play_character_animation: { type: penny, clip_list: [ PLAY_pennyjuice, LOOP_pennyjuice ]}

  - enable_player_control: false
  - set_quest_text_icon: tick-keep
  - fade_in: 2
  - remove_character: penny
  - fade_out: 1
  - set_quest_text_icon: tick-hide
  - set_quest_text: find_darwin
  - show_tutorial: final
  - play_map_button_animation
  - enable_player_control: true
  - lock_door: { door: hw1, locked: false }
  - lock_door: { door: hw3, locked: false }
  - lock_door: { door: hw4, locked: false }
  - lock_door: { door: classroom, locked: false }
  - enable_prop: {prop: {room: classroom, name: chairs, id: 0}}
  - enable_prop: {prop: {room: classroom, name: paint_green, id: 0}}
  - enable_prop: {prop: {room: hw4_classroom, name: trashcan, id: 0}}
  - enable_prop: {prop: {room: hw9_library, name: door_lock_2, id: 0}}
  - enable_prop: {prop: {room: nursing, name: door_lock_3, id: 0}}
  - enable_prop: {prop: {room: nursing, name: cabinet, id: 0}}
  - enable_prop: {prop: {room: hw7_roof, name: locker_1, id: 0}}
  - enable_prop: {prop: {room: hw6_nurse, name: poster, id: 0}}
  - enable_prop: {prop: {room: rooftop, name: broom, id: 0}}
  - enable_prop: {prop: {room: artroom, name: paint_red, id: 0}}
  - enable_prop: {prop: {room: artroom, name: paint_blue, id: 0}}
  - enable_prop: {prop: {room: artroom, name: tv, id: 0}}
  - enable_prop: {prop: {room: artroom, name: blackboard, id: 0}}
  - save_game

# Help Tobias
- quest:
  - jump: main_tobias
  - label: tobias_text
  - set_quest_text: help_tobias
  - end
  - label: main_tobias
  - add_character: {type: tobias, pos: {room: classroom, x: -79, y: 195}}
  - set_character_idle_clip: {clip: LOOP_tobias, type: tobias}
  - set_character_request: {type: tobias, item: headband}
  - wait: {
      character_request_fulfillment: tobias,
      on_first_interaction: tobias_text,
      props_of_interest: [
        {room: hw5_artroom, name: vent, id: 0}
      ],
      markers: false
      }
  - enable_player_control: false
  - set_quest_text_icon: tick-keep
  - play_sfx: mission_completed_tobias
  - play_character_animation: { type: tobias, clip_list: [ PLAY_tobias, LOOP_tobias2 ]}
  - fade_in: 2
  - player_look_at_character: { type: tobias }
  - remove_character: tobias
  - spawn_item: {type: lockpick ,pos: {room: classroom, x: -79, y: 175}}
  - fade_out: 1
  - set_quest_text_icon: tick-hide
  - enable_player_control: true
  - save_game

