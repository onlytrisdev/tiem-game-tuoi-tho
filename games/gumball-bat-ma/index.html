        @font-face {

        @font-face {

            font-family: 'JD Melted';

        html,

        body,

            margin: 0;

            border: 0;

            display: block;

            width: 100%;

            height: 100%;

            overflow: hidden;

        }



        body {

            background-color: #333333;

        }



        canvas {

            display: block;

            margin: 0;

            padding: 0;

            width: 100%;

            bottom: 0;

            visibility: hidden;

        }

            font-family: "JD Melted";

        }



        /* The Modal (background) */

        .modal {

            display: none;

            /* Hidden by default */

            position: fixed;

            /* Stay in place */

            z-index: 1;

            /* Sit on top */

            left: 0;

            top: 0;

            width: 100%;

            /* Full width */

            height: 100%;

            /* Full height */

            overflow: auto;

            /* Enable scroll if needed */

            background-color: rgb(0, 0, 0);

            /* Fallback color */

            background-color: rgba(0, 0, 0, 1);

            /* Black w/ opacity */

        }



        /* Modal Content (Image) */

        .modal-content {

            width: 70%;

            margin: 0;

            position: absolute;

            top: 50%;

            left: 50%;

            margin-right: -50%;

            transform: translate(-50%, -50%)

        }

    </style>
