<html lang="en">
<head>
<meta charset="utf-8">
<title>Hợp nhất diệt Zombie</title>

<script src="../../assets/vendor/clean-runtime.js?v=4"></script>

<meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">

<meta name="renderer" content="webkit">
<meta name="force-rendering" content="webkit">

<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="msapplication-tap-highlight" content="no">

<meta name="full-screen" content="yes">
<meta name="x5-fullscreen" content="true">
<meta name="360-fullscreen" content="true">

<meta name="screen-orientation" content="portrait">
<meta name="x5-orientation" content="portrait">


<meta name="x5-page-mode" content="app">


<link rel="stylesheet" type="text/css" href="style-mobile.css">
<style type="text/css">
        /*手机尺寸*/
        @media screen and (max-width: 480px) {
            .gameWrapper {
                width: 100%;
                height: 100%;
                position: relative;
                margin: auto;
                transform: rotate(0deg);
            }
        }

        /*宽屏尺寸*/
        @media screen and (min-width: 480px) {
            .gameWrapper {
                aspect-ratio: 0.65;
                width: auto;
                height: 100%;
                position: relative;
                margin: auto;
                transform: rotate(0deg);
            }
        }

        @supports not(aspect-ratio: 0.65) {
            .gameWrapper {
                width: 480px;
            }
        }

        .body_bg {
            z-index: 0;
            background-image: url(loading.jpg);
            background-attachment: fixed;
            background-color: #ffffff;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
        }
		canvas{ position:fixed;
			max-width: initial !important;
		}
    </style>

</head>
<body class="body_bg">
<div class="gameWrapper">
<canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0" style="height: 0;"></canvas>
</div>
<script src="src/settings.js" charset="utf-8"></script>
<script src="sdk.app.min.js"></script>
<script src="main.js" charset="utf-8"></script>
<script type="text/javascript">
    function gameStart() {
        // 初始化游戏
        var debug = window._CCSettings.debug;

        function loadScript(moduleName, cb) {
            function scriptLoaded() {
                document.body.removeChild(domScript);
                domScript.removeEventListener('load', scriptLoaded, false);
                cb && cb();
            }

            var domScript = document.createElement('script');
            domScript.async = true;
            domScript.src = moduleName;
            domScript.addEventListener('load', scriptLoaded, false);
            document.body.appendChild(domScript);
        }

        loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.js', function () {
            if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
                loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
            } else {
                window.boot();
            }
        });
    }
	gameStart();    
</script>
</body></html>
