<!DOCTYPE html>

<html>

<head>

	

	<meta charset="utf-8">

	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

	

	<title>Hứng vàng</title>

	<script src="../../assets/vendor/jquery-1.9.1.min.js"></script> 

	<script src="../../assets/vendor/clean-runtime.js?v=4"></script>

	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

	<meta name="apple-mobile-web-app-capable" content="yes">

	<!-- <script type="text/javascript" src="game.js"></script> -->

	

	<style>

        #spilgames-splash-screen{

            width: 100%;

            height: 100%;

        background: url('http://www8.agame.com/mirror/img/Splash_Image_A10.png') top center no-repeat; /* Change "A10" to "GGG" or "Zibbo" based on the brand your game matches */

            position: absolute;

            z-index: 10000; /* Make sure its on top of the game */

            background-size: 90%;

            background-color:#FFF; /* Change to #FFF for GGG or Zibbo branded games */

        }

        .spilgames-splash-screen-gone{

            display:none !important;

        }

    </style>

	

	<script>

		window.addEventListener ("touchmove", function (event) { event.preventDefault (); }, false);

		if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {

			var meta = document.getElementById ("viewport");

			meta.setAttribute ('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');

		}

	</script>

	

	<style>

		html,body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

		#openfl-embed { background: #000000; width: 100%; height: 100%; }

		

		@font-face {

			font-family: 'Assets/fonts/cooperblack.ttf';

			src: url('Assets/fonts/cooperblack.eot');

			src: url('Assets/fonts/cooperblack.eot?#iefix') format('embedded-opentype'),

			url('Assets/fonts/cooperblack.svg#my-font-family') format('svg'),

			url('Assets/fonts/cooperblack.woff') format('woff'),

			url('Assets/fonts/cooperblack.ttf') format('truetype');

			font-weight: normal;

			font-style: normal;

		}



	</style>

	

</head>

<body>	

	<span style="font-family: Assets/fonts/cooperblack.ttf"> </span>

	

	<div id="spilgames-splash-screen" class="spilgames-splash-screen-gone"></div>	

	<div id="openfl-embed"></div>	

	<script type="text/javascript" src="./howler.min.js"></script>

	<script type="text/javascript" src="./DwarfCoins.js"></script>

	

</body>

</html>
