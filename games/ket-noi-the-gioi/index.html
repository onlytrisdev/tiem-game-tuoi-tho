<!DOCTYPE html>

<html lang="en-us">



<head>

    <meta charset="utf-8" />

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <title>Kết nối thế giới</title>

    <!-- Production score SDK. No gameplay prompts: load failure is console-only. -->

    <script src="../../assets/vendor/clean-runtime.js?v=4"></script>

    <script>

    (function(){

      if(typeof window.GV==="function"){

        console.info("[Arcade] GV_SCORE_SDK_READY",{provider:"primary"});

        return;

      }

      console.warn("[Arcade] GV_SCORE_SDK_PRIMARY_UNAVAILABLE",

        "Primary score library did not expose window.GV; trying official-site fallback");

      var sdk=document.createElement("script");

      sdk.src="";

      sdk.async=true;

      sdk.onload=function(){

        if(typeof window.GV==="function")

          console.info("[Arcade] GV_SCORE_SDK_READY",{provider:"fallback"});

        else console.warn("[Arcade] GV_SCORE_SDK_UNAVAILABLE",

          "No GV global after both score SDK sources loaded");

      };

      sdk.onerror=function(){

        console.warn("[Arcade] GV_SCORE_SDK_UNAVAILABLE",

          "Score SDK fallback could not be loaded; button will log missing SDK");

      };

      document.head.appendChild(sdk);

    })();

    </script>

    <!-- <script type="text/javascript"> -->

    <!-- document.domain = '7k7k.com' -->

    <!-- </script> -->

    <link rel="stylesheet" href="TemplateData/style.css" />

    <script src="arcade-save.js?v=20261104r7"></script>

    <script src="arcade-wasm-loader.js?v=20261103r5"></script>

</head>



<body class="dark">

    <div id="unity-container" class="unity-desktop">

        <canvas id="unity-canvas"></canvas>

    </div>

    <div id="loading-cover" style="display: none">

        <div id="unity-loading-bar">

            <div id="unity-progress-bar-empty" style="display: none">

                <div id="unity-progress-bar-full"></div>

            </div>

        </div>

    </div>

    <script>

    const buildUrl = 'Build';

    const loaderUrl = buildUrl + '/connect-people-v0.19.loader.js';

    const config = {

        dataUrl: buildUrl + '/8992eb02aee73aefa4260396d56f6fe8.data',

        frameworkUrl: buildUrl + '/a710e2198f06e7d16e084d6b37f48b76.js?v=20261103r3',

        codeUrl: buildUrl + '/9341c50746882c9e4b4e6816582df1fd.wasm',

        streamingAssetsUrl: '',

        companyName: 'Nuts Puzzle: Sort By Color',

        productName: 'Nuts Puzzle',

        productVersion: '1.0',

    };



    const container = document.querySelector('#unity-container');

    const canvas = document.querySelector('#unity-canvas');

    const loadingCover = document.querySelector('#loading-cover');

    const progressBarEmpty = document.querySelector('#unity-progress-bar-empty');

    const progressBarFull = document.querySelector('#unity-progress-bar-full');



    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

        container.className = 'unity-mobile';

        config.devicePixelRatio = 1;

    }



    loadingCover.style.display = '';

    // Fetch and validate the real uncompressed WASM once; pass validated bytes to Unity.

    // The old .wasm.br server path may be delivered truncated or with incorrect encoding.

    const wasmCheck = Promise.resolve().then(function() {

        return ArcadeWasm.load();

    }).then(function(bytes) {

        return { bytes: bytes };

    }, function(error) {

        return { error: error };

    });

    function showBootError(error) {

        console.error('GV_BOOT_FAILED', error && error.message ? error.message : String(error));

        loadingCover.style.display = '';

        const display = document.createElement('div');

        display.id = 'gv-boot-error';

        display.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10000;background:#151b29;color:#fff;padding:24px;text-align:center;font:16px/1.5 Arial,sans-serif';

        const inside = document.createElement('div');

        const title = document.createElement('strong');

        title.textContent = 'Không tải được dữ liệu game';

        const detail = document.createElement('p');

        detail.textContent = 'File Unity trên máy chủ chưa đầy đủ. Vui lòng thử tải lại; tiến trình đã lưu không bị xóa.';

        const retry = document.createElement('button');

        retry.textContent = 'Tải lại game';

        retry.style.cssText = 'cursor:pointer;min-height:44px;padding:10px 20px';

        retry.addEventListener('click', function() { window.location.reload(); });

        inside.append(title, detail, retry);

        display.appendChild(inside);

        loadingCover.replaceChildren(display);

    }



    const script = document.createElement('script');

    script.src = loaderUrl;

    script.onload = function() {

        let started = false;

        const watchdog = setTimeout(function() {

            if (!started) {

                console.warn("GV_BOOT_WATCHDOG: cloud seeding exceeded 12s, local-only boot");

                ArcadeSave.abortSeed();

                startUnity();

            }

        }, 12000);

        function startUnity() {

            if (started) return;

            started = true;

            clearTimeout(watchdog);

            wasmCheck.then(function(result) {

                if (result.error) { showBootError(result.error); return; }

                config.wasmBinary = result.bytes;

                console.info('[Arcade] GV_BOOT_VALIDATED_WASM', result.bytes.length);

                createUnityInstance(canvas, config, function(progress) {

                    progressBarEmpty.style.display = '';

                    progressBarFull.style.width = (100 * progress) + '%';

                }).then(function(instance) {

                    window.unityInstance = instance;

                    delete config.wasmBinary;

                    loadingCover.style.display = 'none';

                    ArcadeSave.onGameReady();

                }).catch(function(error) { showBootError(error); });

            }).catch(showBootError);

        }

        // Unity's FS.syncfs(true) reads IndexedDB only once in preRun.

        // The cloud seed MUST finish before createUnityInstance.

        Promise.resolve().then(function() {

            return ArcadeSave.init();

        }).then(startUnity).catch(function(err) {

            console.warn("GV_INIT_FAIL", err && err.message ? err.message : err);

            ArcadeSave.abortSeed();

            startUnity();

        });

    };

    script.onerror = function() { showBootError(Error('Unity loader could not be fetched')); };

    document.body.appendChild(script);

    </script>

</body>

<script>

config.devicePixelRatio = 1;

</script>



</html>
