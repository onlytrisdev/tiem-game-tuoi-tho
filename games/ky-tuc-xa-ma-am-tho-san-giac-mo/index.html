  <script type="text/javascript">

    (function () {

      var canvas = document.getElementById('GameCanvas');

      if (!canvas) return;

      function focusCanvas() {

        try { canvas.focus({ preventScroll: true }); } catch (e) {

          try { canvas.focus(); } catch (e2) {}

        }

      }

      canvas.addEventListener('pointerdown', focusCanvas, true);

      canvas.addEventListener('mousedown', focusCanvas, true);

      canvas.addEventListener('click', focusCanvas, true);

      window.addEventListener('load', focusCanvas);

      // Keep receiving keys even if focus drifts to body

      document.addEventListener('keydown', function () {

        if (document.activeElement !== canvas && document.activeElement === document.body) {

          focusCanvas();

        }

      }, true);

    })();

  </script>

<script type="text/javascript">

(function () {

    if (typeof VConsole !== 'undefined') {

        window.vConsole = new VConsole();

    }



    var debug = window._CCSettings.debug;

    var splash = document.getElementById('splash');

    splash.style.display = 'block';



    function loadScript (moduleName, cb) {

      function scriptLoaded () {

          document.body.removeChild(domScript);

          domScript.removeEventListener('load', scriptLoaded, false);

          cb && cb();

      };

      var domScript = document.createElement('script');

      domScript.async = true;

      domScript.src = moduleName;

      domScript.addEventListener('load', scriptLoaded, false);

      document.body.appendChild(domScript);

    }



    loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.js', function () {

      if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {

      else {

        window.boot();

      }

    });

})();
