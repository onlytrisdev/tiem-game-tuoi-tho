		function createLogo(pos_x,pos_y){
			if (ig.game.mLogo!=null)ig.game.removeEntity(ig.game.mLogo);
			/*ig.game.mLogo = ig.game.spawnEntity(
			GGGLogo, ig.game.screen.x + pos_x, ig.game.screen.y + pos_y,{gravityFactor:0});*/
			ig.game.mLogo = ig.game.spawnEntity(Bg, ig.game.screen.x + pos_x, ig.game.screen.y + pos_y,{
				size:{x:99, y:110},
				animSheet: new ig.AnimationSheet( "media/logosmall.png", 99, 110),
				gravityFactor:0,
				onMouseUp:function(){
					window.open( 'http://www.localhost', '_blank' )
				}
			});
			ig.game.mLogo.addAnim("idle",1,[0]);
		}

		function createSound(pos_x,pos_y,size_x,size_y){
			ig.game.mBtnSound = ig.game.spawnEntity(
			Bg, ig.game.screen.x + pos_x, ig.game.screen.y + pos_y,
				{	size:{x:size_x, y:size_y},
					gravityFactor:0,
					onMouseUp:function(){
						if(this.currentAnim == this.anims.sound_on){
							this.currentAnim = this.anims.sound_off.rewind();
							ig.global.BGM.pause();
							ig.global.SOUND = 0;
							ig.global.status_sound= 0;
						}else{
							this.currentAnim = this.anims.sound_on.rewind();
							ig.global.BGM.play();
							ig.global.SOUND = 1;
							ig.global.status_sound= 1;
						}
						ig.global.drawCtr= 30;
					}
				}
			);
			ig.game.mBtnSound.animSheet= new ig.AnimationSheet( "media/btn_sound_on.png", size_x, size_y);
			ig.game.mBtnSound.addAnim("sound_on",1,[0]); 
			ig.game.mBtnSound.animSheet= new ig.AnimationSheet( "media/btn_sound_off.png", size_x, size_y);
			ig.game.mBtnSound.addAnim("sound_off",1,[0]);
			if (ig.global.SOUND==1){
				ig.game.mBtnSound.currentAnim = ig.game.mBtnSound.anims.sound_on;}
			else{
				ig.game.mBtnSound.currentAnim = ig.game.mBtnSound.anims.sound_off;
			}
		}

		function resizeGame() {
			var gameArea = document.getElementById('gameArea');
			var widthToHeight = 4 / 3;
			var newWidth = window.innerWidth;
			var newHeight = window.innerHeight;
			var newWidthToHeight = newWidth / newHeight;
			
			if (newWidthToHeight > widthToHeight) {
				newWidth = newHeight * widthToHeight;
				//gameArea.style.height = newHeight + 'px';
				//gameArea.style.width = newWidth + 'px';
			} else {
				newHeight = newWidth / widthToHeight;
				//gameArea.style.width = newWidth + 'px';
				//gameArea.style.height = newHeight + 'px';
			}
			
			//gameArea.style.marginTop = (-newHeight / 2) + 'px';
			//gameArea.style.marginLeft = (-newWidth / 2) + 'px';

			//newWidth *= 0.5; newHeight *= 0.5;
			
			var gameCanvas = document.getElementById('canvas');
			gameCanvas.style.width =  newWidth + 'px';
			gameCanvas.style.height =  newHeight + 'px';
			//gameCanvas.width = newWidth;
			//gameCanvas.height = newHeight;
		}
		
		window.addEventListener('load', resizeGame, false);
		window.addEventListener('resize', resizeGame, false);
