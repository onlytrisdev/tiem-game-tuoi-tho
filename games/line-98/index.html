			<script language="javascript" type="text/javascript">
				function pageLoad()
				{
					CanvasResize();
					GameInit();
					MouseInit();

					// firebase.database().ref("anonymous/" + firebase_uid).update({"start": Date.now()});
					// firebase.database().ref('anonymous/' + firebase_uid).onDisconnect().remove();

					firebase.auth().onAuthStateChanged((user) => {
						if (user) {
							firebase_uid = user.uid;
							console.log("Signed In!");
							console.log(firebase_uid);
							if (user.displayName) {
								gamePlayerName= user.displayName;
							} else {
								gamePlayerName= name_id.replace("_", " ");
							}
						} else {
							firebase_uid= "";
							gamePlayerName= name_id.replace("_", " ");
							console.log("Signed Out!");
						}
						console.log("gamePlayerName: "+ gamePlayerName);
						if (firebase_uid== "") {
							document.getElementById("signIn").style.display= "";
							document.getElementById("name_id").innerHTML= "&nbsp;";
								// decodeURIComponent(escape("\xf0\x9f\x8e\xad"))+ " "+
								// gamePlayerName;
						} else {
							document.getElementById("signIn").style.display= "none";
							document.getElementById("name_id").innerHTML=
								decodeURIComponent(escape("\xf0\x9f\x8e\xae"))+ " "+
								gamePlayerName+
								" [ <a href='#' onclick='signOut();'>Sign Out</a> ]";
						}
						firebase.firestore().collection("sessions").doc(session_id).set({
							start: Date.now(),
							name: gamePlayerName,
							auth_uid: firebase_uid,
							country: country_code || "ZZ",
						}, {merge: true});
					});

					firebase.database().ref('stats/online').on('value', (snapshot) => {
						stats_online= snapshot.val();
					});

					for (i= 1; i<= 10; i++) {
						firebase.database().ref('stats/live_scores').child(i).on('value', (snapshot) => {
							StatsScoreUpdate(snapshot.key, "ls_", snapshot.val());
						});
					}

					for (i= 1; i<= 10; i++) {
						firebase.database().ref('stats/daily_ranking').child(i).on('value', (snapshot) => {
							StatsScoreUpdate(snapshot.key, "dr_", snapshot.val());
						});
					}
				}

				function pageResize()
				{
					CanvasResize();
				}

				function signIn(providerName) {
					let provider;
					if (providerName=="fb") {
						provider= new firebase.auth.FacebookAuthProvider();
						// provider.addScope('profile');
						// provider.addScope('email');
					} else if (providerName=="gg") {
						provider= new firebase.auth.GoogleAuthProvider();
						// provider.addScope('profile');
						// provider.addScope('email');
					} else if (providerName=="tw") {
						provider= new firebase.auth.TwitterAuthProvider();
					}
					provider.setCustomParameters({'display': 'popup'});
					firebase.auth().signInWithPopup(provider)
					.then((result) => {
						console.log(result);
					})
					.catch((error) => {
						console.log(error);
						// alert("Under Construction!");
					});
				}

				function signOut() {
					firebase.auth().signOut();
				}
			</script>
