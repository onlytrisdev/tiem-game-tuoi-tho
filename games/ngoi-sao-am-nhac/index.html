<!DOCTYPE html>

<html lang="en-us">

  <head>

    <meta charset="utf-8">

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Ngôi sao âm nhạc</title>

	<script src="../../assets/vendor/clean-runtime.js?v=4"></script>

    <!-- <link rel="shortcut icon" href="TemplateData/favicon.ico"> -->

    <link rel="stylesheet" href="TemplateData/style.css?v=20261031-3">

    <!-- Critical HUD styles are intentionally embedded: icon visibility must not depend on arcade-ui.js. -->

    <style id="gv-hud-critical">

      #unity-container { isolation: isolate; }

      #gv-hud-actions {

        position: absolute !important;

        z-index: 2147483645 !important;

        left: 50%;

        bottom: calc(8px + env(safe-area-inset-bottom, 0px));

        transform: translateX(-50%);

        display: flex !important;

        flex-direction: row !important;

        align-items: center;

        justify-content: center;

        gap: 8px;

        width: max-content;

        visibility: visible !important;

        opacity: 1 !important;

        pointer-events: none;

        user-select: none;

        -webkit-user-select: none;

      }

      #gv-hud-actions button {

        display: flex;

        flex: 0 0 56px;

        align-items: center;

        justify-content: center;

        width: 56px;

        height: 56px;

        min-width: 56px;

        min-height: 56px;

        padding: 0;

        margin: 0;

        border: 0;

        background: transparent;

        cursor: pointer;

        pointer-events: auto;

        touch-action: manipulation;

        -webkit-tap-highlight-color: transparent;

      }

      #gv-hud-actions button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

      #gv-hud-actions img {

        display: block !important;

        visibility: visible !important;

        opacity: 1 !important;

        width: 100%;

        height: 100%;

        object-fit: contain;

        pointer-events: none;

        filter: drop-shadow(0 2px 3px rgba(0,0,0,.7));

        user-select: none;

        -webkit-user-drag: none;

      }

    </style>

  </head>

  <body>

    <div id="unity-container" class="unity-desktop">

      <canvas id="unity-canvas"></canvas>

      <!-- Static overlay: visible immediately, even before the external HUD script runs. -->

      <div id="gv-hud-actions" role="group" aria-label="Các nút Arcade" data-gv-hud="20261031-3">

        <button id="gv-reset-btn" type="button" title="Xóa dữ liệu" aria-label="Xóa dữ liệu">

          <img src="./reset-data.png" alt="" width="56" height="56" draggable="false">

        </button>

        <button id="gv-score-btn" type="button" title="Gửi điểm cao nhất" aria-label="Gửi điểm cao nhất">

          <img src="./save-score.png" alt="" width="56" height="56" draggable="false">

        </button>

      </div>

      <div id="unity-loading-bar">

        <div id="unity-logo"></div>

        <div id="unity-progress-bar-empty">

          <div id="unity-progress-bar-full"></div>

        </div>

      </div>

      <div id="unity-warning"> </div>

      <!--

      <div id="unity-footer">

        <div id="unity-webgl-logo"></div>

        <div id="unity-fullscreen-button"></div>

        <div id="unity-build-title">Aotopia</div>

      </div>

      -->

    </div>

    <script src="arcade-save.js?v=20261031-5"></script>

    <script src="arcade-ads.js?v=20261030-1"></script>

    <script src="arcade-ui.js?v=20261031-3"></script>

    <script>

      var container = document.querySelector("#unity-container");

      var canvas = document.querySelector("#unity-canvas");

      var loadingBar = document.querySelector("#unity-loading-bar");

      var progressBarFull = document.querySelector("#unity-progress-bar-full");

      //var fullscreenButton = document.querySelector("#unity-fullscreen-button");

      var warningBanner = document.querySelector("#unity-warning");



      // Shows a temporary message banner/ribbon for a few seconds, or

      // a permanent error message on top of the canvas if type=='error'.

      // If type=='warning', a yellow highlight color is used.

      // Modify or remove this function to customize the visually presented

      // way that non-critical warnings and error messages are presented to the

      // user.

      function unityShowBanner(msg, type) {

        function updateBannerVisibility() {

          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';

        }

        var div = document.createElement('div');

        div.innerHTML = msg;

        warningBanner.appendChild(div);

        if (type == 'error') div.style = 'background: red; padding: 10px;';

        else {

          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';

          setTimeout(function() {

            warningBanner.removeChild(div);

            updateBannerVisibility();

          }, 5000);

        }

        updateBannerVisibility();

      }



      var buildUrl = "Build";

      var loaderUrl = buildUrl + "/Release.loader.js";

      var config = {

        dataUrl: buildUrl + "/Release.data",

        frameworkUrl: buildUrl + "/Release.framework.js",

        codeUrl: buildUrl + "/Release.wasm",

        streamingAssetsUrl: "StreamingAssets",

        companyName: "DefaultCompany",

        productName: "Aotopia",

        productVersion: "demo1.0",

        showBanner: unityShowBanner,

      };



      // By default Unity keeps WebGL canvas render target size matched with

      // the DOM size of the canvas element (scaled by window.devicePixelRatio)

      // Set this to false if you want to decouple this synchronization from

      // happening inside the engine, and you would instead like to size up

      // the canvas DOM size and WebGL render target sizes yourself.

      // config.matchWebGLToCanvasSize = false;



      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

        container.className = "unity-mobile";

        // Avoid draining fillrate performance on mobile devices,

        // and default/override low DPI mode on mobile browsers.

        config.devicePixelRatio = 1;

        // Mobile layout is tested separately; do not show Unity's generic warning.

      } else {

        canvas.style.width = "100%";

        canvas.style.height = "100%";

      }

      loadingBar.style.display = "block";



      var script = document.createElement("script");

      script.src = loaderUrl;

      script.onload = async () => {

        // Cloud seed must finish BEFORE Unity syncfs(true) in createUnityInstance.

        try {

          await window.ArcadeSave.init();

        } catch (err) {

          console.warn("GV_BOOT_INIT_FAIL", err.message);

        }

        createUnityInstance(canvas, config, (progress) => {

          progressBarFull.style.width = 100 * progress + "%";

        }).then((unityInstance) => {

          window.__gvUnityInstance = unityInstance;

          // Begin cloud dirty tracking only after Unity has populated IDBFS.

          if (window.ArcadeSave && typeof window.ArcadeSave.nativeReady === "function") {

            window.ArcadeSave.nativeReady();

          }

          loadingBar.style.display = "none";

          //fullscreenButton.onclick = () => {

          //  unityInstance.SetFullscreen(1);

          //};

        }).catch((message) => {

          alert(message);

        });

      };

      document.body.appendChild(script);

    </script>

  </body>

</html>
