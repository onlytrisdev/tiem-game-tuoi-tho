        function resize_game() {

            var w = window.innerWidth;

            var h = window.innerHeight;

            var ratio = w / h;

            var newW = 750;

            var newH = 550;

            var sRatio = newW / newH;

            if(ratio > 1) {

               if(newH > h)

                {

                    newH = h;

                    newW = newH * sRatio;

                }

            } else {

                 if(newW > w) {

                    newW = w;

                    newH = w / sRatio

                }

                

            }

            var zoomVal = Math.round(newW / 750 * 100)/100;

            var lft = (w -newW)/2 / zoomVal;

            var t = (h -newH)/2 / zoomVal;

            var gw = document.getElementById('gameWrap');

            gw.style.zoom = zoomVal;

            gw.style.left = Math.round(lft) + 'px';

            gw.style.top = Math.round(t) + 'px';

            /*document.getElementById('info').innerHTML = 'w=' + window.innerWidth + ';h=' + window.innerHeight + ';zoom=' + zoomVal + ';lft'+lft + ';top='+t + ';w=' + gw.clientWidth;*/

        }

        function start_load() {

                loadImg.onload = imgLoaded;

                loadImg.onerror = imgLoadErr;

            }

            

            loadImg.src = basepath + manifest[loadCount];

        }

        function imgLoaded() {

            loadCount ++;

           

            document.getElementById('progress').style.width = Math.round(loadCount / loadTotal * 200) + 'px'

            start_load();

        }

        function imgLoadErr() {

            setTimeout(start_load, 800);

		function output_ele(selector) {

			var rtn = {};

			var offset = $(selector).offset();

			$(selector).children().each(function() {

				var offset1 = $(this).offset();

				rtn[$(this).attr('id')] = {left:offset1.left - offset.left, top:offset1.top - offset.top};

				

			})

			return rtn;

		}

		function print_obj(obj) {

			var str = '{';

			var arr = [];

			for(var m in obj) {

				var tmpstr = m + ':';

				var val = obj[m];

				if(typeof(obj[m]) == 'object') {

					tmpstr += print_obj(obj[m]);

				} else {

					tmpstr += obj[m]

				}

				arr.push(tmpstr);

			}

			str += arr.join(',') + '}';

			return str;

		}
