<!DOCTYPE html>
<html>
<head><script src="../../assets/vendor/clean-runtime.js?v=4"></script>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ngôi sao thời trang</title>
<style>
			html { 
			  
			}
			body{
				margin: 0;
				padding: 0;
				background-color: #b8175f;
			}

			#gameContainer{
				width: 100%;
				height: 100%;
				position: absolute;
				overflow: hidden;
			}
		</style>
<script>
		var width = window.innerWidth;    
var interval = setInterval(function(){    
if (width === 0) {    
if (typeof document.body === "object" && document.body !== null){   
document.body.style.display = "none";   
}   
if (window.innerWidth > width) {    
window.location.reload();   
clearInterval(interval);    
return;   
}   
} else {    
clearInterval(interval);    
}   
},50);  
		document.onkeydown = function(e) {
		
			if(e.keyCode == 123) {
			return false;
			}
			if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)){

			return false;
			}
			if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)){
			return false;
			}
			if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)){
			return false;
			}
			}
		
		</script></head>
<body>
<div class="gameContainer" id="gameContainer"></div>
<script src="js/phaser.min.js"></script>
<script src="forgame/relatedgames.js"></script>
<script src="forgame/functions.js"></script>
<script src="js/main.js"></script>


</body>
</html>
