<script type="text/javascript">
(function () {

    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    function withToken(url) {
        var token = window.GV_ASSET_VERSION || '';
        if (!token) {
            return url;
        }
        var sep = url.indexOf('?') >= 0 ? '&' : '?';
        return url + sep + 'v=' + encodeURIComponent(token);
    }

    function startEngine() {
        var cocos2d = document.createElement('script');
        cocos2d.async = true;
        cocos2d.src = withToken(window._CCSettings.debug ? 'cocos2d-js.js' : 'cocos2d-js-min.18202.js');

        var engineLoaded = function () {
            document.body.removeChild(cocos2d);
            cocos2d.removeEventListener('load', engineLoaded, false);
            var bootGame = function () {
                window.boot();
                if (window.ArcadeSave && ArcadeSave.startPeriodicSave) {
                    ArcadeSave.startPeriodicSave();
                }
            };
            if (window.ArcadeSave && ArcadeSave.init) {
                Promise.resolve()
                    .then(function () { return ArcadeSave.init(); })
                    .then(bootGame, bootGame);
            } else {
                bootGame();
            }
        };
        cocos2d.addEventListener('load', engineLoaded, false);
        document.body.appendChild(cocos2d);
    }

    Promise.resolve(window.__gvLoadCorePromise).then(startEngine, function (err) {
        console.error('[GV_BUILD] core scripts failed to load.', err);
    });
})();
