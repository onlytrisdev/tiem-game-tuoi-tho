<!DOCTYPE html>

<html lang="en-us">



<head>

    <!--OTP version 1.2-->

    <meta charset="utf-8">

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Nhấc bổng mọi thứ</title>

	<script src="../../assets/vendor/clean-runtime.js?v=4"></script>

    <script src="arcade-ads.js?v=20261103-1"></script>

    <script src="arcade-save.js?v=20261104-r4-bottom-left"></script>

    <link rel="stylesheet" href="arcade-ui.css?v=20261104-bottom-left-1">



    <!-- <script type="text/javascript"> -->

    <!-- document.domain = '7k7k.com' -->

    <!-- </script> -->

    <script type="text/javascript" src="7k7k.js"></script>

    <link rel="stylesheet" href="TemplateData/style.css">

</head>



<body>

    <div id="unity-container" class="unity-desktop" style="width: 100%; height: 100%; overflow-x: hidden; overflow-y: hidden;">

        <canvas id="unity-canvas" style="width: 100%; height: 100%; cursor: default;"></canvas>

        <div id="unity-loading-bar">

            <div id="unity-logo"></div>

            <div id="unity-progress-bar-empty">

                <div id="unity-progress-bar-full"></div>

            </div>

        </div>

    </div>

    <script>

    //Lock Scaling/Zooming

    document.head.insertAdjacentHTML('beforeend', '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">');

    document.head.insertAdjacentHTML('beforeend', '<meta name="HandheldFriendly" content="true" />');



    document.addEventListener("gesturestart", function(e) {

        e.preventDefault();

    });



    document.addEventListener("gesturechange", function(e) {

        e.preventDefault();

    });

    document.addEventListener("gestureend", function(e) {

        e.preventDefault();

    });



    var container = document.querySelector("#unity-container");

    var canvas = document.querySelector("#unity-canvas");

    var loadingBar = document.querySelector("#unity-loading-bar");

    var progressBarFull = document.querySelector("#unity-progress-bar-full");



    var buildUrl = "Build";

    var loaderUrl = buildUrl + "/be5c8a837410560f3ca8989808c21df4.js";

    var config = {

        dataUrl: buildUrl + "/105ac0bda6956fd089a633c83e5f6d73.data",

        frameworkUrl: buildUrl + "/d5f300db9f42adf004d386f1d480f5f1.js",

        codeUrl: buildUrl + "/e67c3f8cf3f9b9d7e009a6fce0706a38.wasm",

        streamingAssetsUrl: "StreamingAssets",

        companyName: "One Two Tap",

        productName: "Pull Em All",

        productVersion: "0.1",

    };



    //Mobile

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

        var meta = document.createElement('meta');

        meta.name = 'viewport';

        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';

        document.getElementsByTagName('head')[0].appendChild(meta);



        container.className = "unity-mobile";



        canvas.style.width = "100%";

        canvas.style.height = "100%";



        //Resize window when chage orentation

        window.addEventListener("orientationchange", event => {

            canvas.style.width = "100%";

            canvas.style.height = "100%";

        });

    }

    //PC

    else {

        canvas.style.width = "100%";

        canvas.style.height = "100%";

    }



    loadingBar.style.display = "block";



    var script = document.createElement("script");

    script.src = loaderUrl;

    script.onload = async () => {

        // Unity populates /idbfs once during preRun. Cloud seed MUST complete first.

        // Timeouts inside init are bounded; a watchdog prevents an endless splash.

        let booted = false;

        const boot = () => {

            if (booted) return;

            booted = true;

            window.__gvUnityBooted = true;

            createUnityInstance(canvas, config, (progress) => {

                progressBarFull.style.width = 100 * progress + "%";

            }).then((unityInstance) => {

                window.myGameInstance = unityInstance;

                loadingBar.style.display = "none";

                if (window.ArcadeSave) {

                    ArcadeSave.mountUI();

                    ArcadeSave.start();

                }

            }).catch((message) => {

                console.error("GV_UNITY_BOOT_FAIL", message);

            });

        };

        const watchdog = window.setTimeout(() => {

            console.warn("GV_CLOUD_BOOT_WATCHDOG");

            if (window.ArcadeSave) ArcadeSave.abortBoot();

            boot();

        }, 16000);

        try {

            if (window.ArcadeSave) await ArcadeSave.init();

        } catch (e) {

            console.warn("GV_CLOUD_INIT_ERROR", e && e.message);

        } finally {

            window.clearTimeout(watchdog);

            boot();

        }

    };

    document.body.appendChild(script);

    </script>

</body>



</html>
