<html lang="en-us">

<head>

  <meta charset="utf-8">

  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Noob thợ rừng</title>

  

  <script src="../../assets/vendor/clean-runtime.js?v=4"></script>

  

  <link rel="stylesheet" href="TemplateData/style.css">

  <script src="TemplateData/gamescore-unity.js"></script>

  <script>

    var _unityAwaiter = {};

    _unityAwaiter.ready = new Promise((resolve, reject) => {

      _unityAwaiter.done = resolve;

      _unityAwaiter.abort = reject;

    });

    window.onGSInit = async (gs) => {



      await gs.player.ready;

      gs.ads.showSticky();

      if(!gs.payments.isAvailable || !gs.payments.has("noAds"))

      {

          const showPreloaderAd = "true";

          if (showPreloaderAd) {

            gs.ads.showPreloader();

      }

      }

      else

      {

            gs.ads.closeSticky()

      }



      await _unityAwaiter.ready;

      window.GameScore = new GameScoreUnity(gs, unityI);



      //const intervalID = setInterval(Sync, 150000);

    };



    function GetMobileOperatingSystem() 

    {

        var userAgent = navigator.userAgent || navigator.vendor || window.opera;



        // iOS detection from: http://stackoverflow.com/a/9039885/177710

        if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {

            return "true";

        }



        return "false";

    }



    function Sync() {

          GameScore.PlayerSync(false)

          console.info("sync");

      }



    window.addEventListener('resize', function (event) {

          var bool = window.innerWidth > window.innerHeight ? 1 : 0;

          unityI.SendMessage('Main Camera', 'SetFOV', bool);

        }, true);

  </script>

</head>



<body class="dark">

  <div id="unity-container" class="unity-desktop">

    <canvas id="unity-canvas"></canvas>

  </div>

  <div id="loading-cover" style="display:none;">

    <div id="unity-loading-bar">

      <div id="unity-logo"><img src="logo.png"></div>

      <div id="unity-progress-bar-empty" style="display: none;">

        <div id="unity-progress-bar-full"></div>

      </div>

      <div class="spinner"></div>

    </div>

  </div>



  <script>

    const buildUrl = "Build";

    const loaderUrl = buildUrl + "/Noob v4.3.loader.js";

    const config = {

      dataUrl: buildUrl + "/cac3b7f11bef109e204cea4b766c1a70.data.unityweb",

      frameworkUrl: buildUrl + "/cbba673e4b17e3f92f757dbf2e02fbd9.js.unityweb",

      codeUrl: buildUrl + "/48694f15111989f3ad41a5445c078186.wasm.unityweb",

      streamingAssetsUrl: "StreamingAssets",

      companyName: "EfimMaximov",

      productName: "Noob Lumberjack",

      productVersion: "1.1",

    };



    const container = document.querySelector("#unity-container");

    const canvas = document.querySelector("#unity-canvas");

    const loadingCover = document.querySelector("#loading-cover");

    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");

    const progressBarFull = document.querySelector("#unity-progress-bar-full");

    const spinner = document.querySelector('.spinner');



    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

      container.className = "unity-mobile";

      //config.devicePixelRatio = 1;

    }



    loadingCover.style.display = "";



    const script = document.createElement("script");

    var unityI = null;

    script.src = loaderUrl;

    script.onload = () => {

      createUnityInstance(canvas, config, (progress) => {

        spinner.style.display = "none";

        progressBarEmpty.style.display = "";

        progressBarFull.style.width = `${100 * progress}%`;

      }).then((unityInstance) => {

        _unityAwaiter.done(unityInstance);

        unityI = unityInstance;

        loadingCover.style.display = "none";

      }).catch((message) => {

        _unityAwaiter.abort(message);

        alert(message);

      });

    };

    document.body.appendChild(script);



    document.addEventListener("pointerdown", () => {

      container.focus();

      window.focus();

      canvas.focus();

    });



  </script>

</body>



</html>
