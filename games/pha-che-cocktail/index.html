

<!DOCTYPE html>

<html lang="en">

<head>

	

	<meta charset="utf-8">

	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

	

	<title>Pha chế Cocktail - Bartender Make Right Mix</title>

	

<script src="../../assets/vendor/jquery-1.9.1.min.js"></script> 

<script src="../../assets/vendor/clean-runtime.js?v=4"></script>	

	

	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

	<meta name="apple-mobile-web-app-capable" content="yes">

	

	

	<script type="text/javascript" src="./lib/soundjs.min.js"></script>

	<script type="text/javascript" src="./bartender_make_right_mix.js"></script>

	<script type="text/javascript" src="./arcade-h5.js"></script>

	

	<script>

		window.addEventListener ("touchmove", function (event) { event.preventDefault (); }, false);

		if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {

			var meta = document.getElementById ("viewport");

			meta.setAttribute ('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');

		}

	</script>

	

	<style>

		html,body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

		#openfl-content { background: #000000; width: 100%; height: 100%; }

		

		@font-face {

			font-family: 'Fredoka One';

			src: url('fonts/FredokaOne-Regular.eot');

			src: url('fonts/FredokaOne-Regular.eot?#iefix') format('embedded-opentype'),

			url('fonts/FredokaOne-Regular.svg#my-font-family') format('svg'),

			url('fonts/FredokaOne-Regular.woff') format('woff'),

			url('fonts/FredokaOne-Regular.ttf') format('truetype');

			font-weight: normal;

			font-style: normal;

		}

		@font-face {

			font-family: 'Kool Beans';

			src: url('fonts/KoolBean.eot');

			src: url('fonts/KoolBean.eot?#iefix') format('embedded-opentype'),

			url('fonts/KoolBean.svg#my-font-family') format('svg'),

			url('fonts/KoolBean.woff') format('woff'),

			url('fonts/KoolBean.ttf') format('truetype');

			font-weight: normal;

			font-style: normal;

		}

		@font-face {

			font-family: 'Riffic Free Bold';

			src: url('fonts/RifficFree-Bold.eot');

			src: url('fonts/RifficFree-Bold.eot?#iefix') format('embedded-opentype'),

			url('fonts/RifficFree-Bold.svg#my-font-family') format('svg'),

			url('fonts/RifficFree-Bold.woff') format('woff'),

			url('fonts/RifficFree-Bold.ttf') format('truetype');

			font-weight: normal;

			font-style: normal;

		}

	</style>

	

</head>

<body>

	

	<div id="openfl-content"></div>

	

	<script type="text/javascript">

		(function () {

			function startGame() { lime.embed("openfl-content", 0, 0, "FFFFFF"); }

			if (window.ArcadeCocktail) {

				Promise.resolve(window.ArcadeCocktail.init()).then(startGame, function (error) {

					console.warn("[Arcade Cocktail] Local-only startup:", error);

					startGame();

				});

			} else startGame();

		})();

	</script>

	

</body>
