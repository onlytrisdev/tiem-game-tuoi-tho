<script type="text/javascript">

(function () {

    // Step 4 = nhánh có QC (trước đây là 4399 h5api; giờ Arcade GVAdBreak)

    window.Step = 4;



    function startBoot() {

      var splash = document.getElementById('splash');

      splash.style.display = 'block';



      var cocos2d = document.createElement('script');

      cocos2d.async = true;

      cocos2d.src = window._CCSettings.debug ? 'cocos2d-js.js' : 'cocos2d-js-min.990b6.js';



      var engineLoaded = function () {

          document.body.removeChild(cocos2d);

          cocos2d.removeEventListener('load', engineLoaded, false);

          window.boot();

      };

      cocos2d.addEventListener('load', engineLoaded, false);

      document.body.appendChild(cocos2d);

    }



    if (window.ArcadeSave && window.ArcadeSave.ready) {

      window.ArcadeSave.ready.then(startBoot).catch(startBoot);

    } else {

      startBoot();

    }

})();

</script>
