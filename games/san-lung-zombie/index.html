  </div>

<script src="src/settings.js" charset="utf-8"></script>

<script src="main.js" charset="utf-8"></script>

<script type="text/javascript">
(function () {
    // open web debugger console
    if (typeof VConsole !== 'undefined') {
        window.vConsole = new VConsole();
    }

    var debug = window._CCSettings.debug;
    var splash = document.getElementById('splash');
    splash.style.display = 'block';
    var bootStarted = false;

    function loadScript (moduleName, cb, errCb) {
      function scriptLoaded () {
          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          domScript.removeEventListener('error', scriptError, false);
          cb && cb();
      };
      function scriptError () {
          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          domScript.removeEventListener('error', scriptError, false);
          console.error('[boot] failed to load script:', moduleName);
          errCb && errCb(moduleName);
      };
      var domScript = document.createElement('script');
      domScript.async = true;
      domScript.src = moduleName;
      domScript.addEventListener('load', scriptLoaded, false);
      domScript.addEventListener('error', scriptError, false);
      document.body.appendChild(domScript);
    }

    function startBoot () {
      if (bootStarted) return;
      bootStarted = true;
      console.log('[boot] startBoot');
      try {
        if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
          loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
        } else {
          window.boot();
        }
      } catch (e) {
        console.error('[boot] window.boot threw', e);
      }
    }

    // Fail-open if ArcadeSave.init never settles (should not happen on local-only).
    setTimeout(function () {
      if (!bootStarted) {
        console.warn('[boot] watchdog forcing startBoot after 5s');
        startBoot();
      }
    }, 5000);

    var engineFile = debug ? 'cocos2d-js.js' : 'cocos2d-js-min.js';
    console.log('[boot] loading engine', engineFile);
    loadScript(engineFile, function () {
      console.log('[boot] engine loaded, ArcadeSave.init');
      var ready = Promise.resolve();
      try {
        if (window.ArcadeSave && typeof window.ArcadeSave.init === 'function') {
          ready = window.ArcadeSave.init();
        }
      } catch (e) {
        console.warn('[ArcadeSave] init error', e);
      }
      Promise.resolve(ready).catch(function (e) {
        console.warn('[boot] init rejected, continue', e);
      }).then(startBoot);
    }, function () {
      console.error('[boot] Cocos engine script missing/blocked — splash will stay. Check Network for', engineFile);
    });
})();
</script>
