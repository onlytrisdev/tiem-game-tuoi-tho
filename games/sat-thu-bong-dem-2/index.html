<script>

// GLOBAL VAR

var scene = null;

var camera = null;

var renderer = null;

var clock = new THREE.Clock();



var updateArray = [];

var playerSpawnPos = new THREE.Vector3();

var enemySpawnPos = [];

var collidersArray = [];

var gameOver = false;

var playerAngle = 0;

var playerMove = false;

var playerSpeed = 0;

var playerDetectionArray = [];

var enemiesArray = [];

var player;

var level_center = {};

var level_top = {};

var level_right = {};

var level_left = {};

var nextLevelBlock = 'level_center';

var nextX = 0;

var nextX2 = 0;

var nextZ = 0;

var particleArray = [];

var time = null;

}

if (!level > 0)

level = 1;



const BaseModel = {

    level_right2: {url: 'Models/Level2_Right.fbx'},

    level_right3: {url: 'Models/Level3_Right.fbx'},

    level_right4: {url: 'Models/Level4_Right.fbx'},

    level_left1: {url: 'Models/Level1_Left.fbx'},

    level_left2: {url: 'Models/Level2_Left.fbx'},

    level_left3: {url: 'Models/Level3_Left.fbx'},

    level_left4: {url: 'Models/Level4_Left.fbx'},

}

const Anims = {

    ninja_idle: {url: 'Models/A_Idle.fbx'},

    ninja_walk: {url: 'Models/A_Walk.fbx'},

    ninja_attack: {url: 'Models/A_Attack.fbx'},

    ninja_die: {url: 'Models/A_Die.fbx'},

    enemy_idle: {url: 'Models/A_E_Idle.fbx'},

    enemy_walk: {url: 'Models/A_E_Walk.fbx'},

    enemy_attack: {url: 'Models/A_E_Firing.fbx'},

    enemy_die: {url: 'Models/A_E_Die.fbx'},

}

const Textures = {

    shadow: {url: 'Images/shadow.png'},

    muzzle: {url: 'Images/Muzzle.png'},

    exclamation: {url: 'Images/Exclamation.png'},

    blood: {url: 'Images/blood.png'},

}

const Sound = {

    button: {url: 'Sound/Button.mp3'},

    attack1: {url: 'Sound/Attack1.mp3'},

    attack2: {url: 'Sound/Attack2.mp3'},

    complete: {url: 'Sound/Complete.mp3'},

    gameOver: {url: 'Sound/GameOver.mp3'},

    music: {url: 'Sound/Music.mp3'},

}



// DOM elements

const CANVAS = document.querySelector('#c');

const PROGRESS_TEXT = document.querySelector('#progressText');

const GAME_UI = document.querySelector('#gameUI');

const GAMEOVER_UI = document.querySelector('#gameOverUI');

const HIT_FX = document.querySelector('#redFX');

const BTN_RESTART = document.querySelector('#btnRestart');

const GO_MESSAGE = document.querySelector('#goMessage');

const LVL = document.querySelector('#lvlNo');

/*const BRANDING = document.querySelector('#ingameLagged');*/

const BTN_SOUND = document.querySelector('#btnSound');

const SCORE_TEXT = document.querySelector('#scoreText');

const ENEMIES_COUNTER = document.querySelector('#enemiesLeftDisplay');

const TUT1 = document.querySelector('#tut1');

const TUT2 = document.querySelector('#tut2');



// --MAIN GAME FUNCTION-- //



function preload() {

    const progressbarElem = document.querySelector('#progressbar');

    let manager = new THREE.LoadingManager();

    manager.onStart = function ( url, itemsLoaded, itemsTotal ) {

        //console.log( 'Started loading file: ' + url + '.\nLoaded ' + itemsLoaded + ' of ' + itemsTotal + ' files.' );

    };

    manager.onLoad = function ( ) {

        //console.log( 'Loading complete!');

        init();

        // hide the loading bar

        const loadingElem = document.querySelector('#loading');

        loadingElem.style.display = 'none';

    };

    manager.onProgress = function ( url, itemsLoaded, itemsTotal ) {

        //console.log( 'Loading file: ' + url + '.\nLoaded ' + itemsLoaded + ' of ' + itemsTotal + ' files.' );

        progressbarElem.style.width = `${itemsLoaded / itemsTotal * 100 | 0}%`;

        PROGRESS_TEXT.innerHTML = `${itemsLoaded / itemsTotal * 100 | 0}%`;

    };

    manager.onError = function ( url ) {

        //console.log( 'There was an error loading ' + url );

    };



    var loader = new THREE.FBXLoader( manager );

    // load base character model

    for (const model of Object.values(BaseModel)) {

        loader.load( model.url, function ( fbx ) {

            model.fbx = fbx;

        });

    }

    // load anims

    for (const model of Object.values(Anims)) {

        loader.load( model.url, function ( fbx ) {

            //model.fbx = fbx;

            model.animation = fbx.animations[ 0 ];

        });

    }

    // load textures

    var loaderTex = new THREE.TextureLoader(manager);

    for (const img of Object.values(Textures)) {

        loaderTex.load( img.url, function(texture) {

            texture.encoding = THREE.sRGBEncoding;

            img.texture = texture;

        });

    }

    // load audio

    Sound.listener = new THREE.AudioListener();

    const audioLoader = new THREE.AudioLoader( manager );

    for (const key of Object.values(Sound)) {

        audioLoader.load( key.url, function(buffer) {

            key.sound = new THREE.Audio( Sound.listener );

            key.sound.setBuffer( buffer );



            key.sound.setVolume( 2 );

            if (key.url == 'Sound/Music.mp3'){

                key.sound.setLoop( true );

                key.sound.setVolume( 0.4 );

            }

        });

    }

}



function init(){

    if (level == 1){

        TUT1.style.visibility = "visible";

        TUT2.style.visibility = "visible";

    }

    GAME_UI.style.visibility = "visible";

    SCORE_TEXT.innerHTML = "Điểm: 0";

    BTN_SOUND.style.visibility = "visible";



    level_center = {

        1: {

            model: BaseModel.level.fbx,

            exit: 'top',

        },

        2: {

            model: BaseModel.level2.fbx,

            exit: 'top',

        },

        3: {

            model: BaseModel.level3.fbx,

            exit: 'top',

        },

    };

    level_top = {

        1: {

            model: BaseModel.level_top1.fbx,

            exit: 'top',

        },

        2: {

            model: BaseModel.level_top2.fbx,

            exit: 'right',

        },

        3: {

            model: BaseModel.level_top3.fbx,

            exit: 'left',

        },

        4: {

            model: BaseModel.level_top4.fbx,

            exit: 'top',

        },

    };

    level_right = {

        1: {

            model: BaseModel.level_right1.fbx,

            exit: 'top',

        },

        2: {

            model: BaseModel.level_right2.fbx,

            exit: 'right',

        },

        3: {

            model: BaseModel.level_right3.fbx,

            exit: 'right',

        },

        4: {

            model: BaseModel.level_right4.fbx,

            exit: 'right',

        },

    };

    level_left = {

        1: {

            model: BaseModel.level_left1.fbx,

            exit: 'left',

        },

        2: {

            model: BaseModel.level_left2.fbx,

            exit: 'top',

        },

        3: {

            model: BaseModel.level_left3.fbx,

            exit: 'left',

        },

        4: {

            model: BaseModel.level_left4.fbx,

            exit: 'left',

        },

    };

    renderer = new THREE.WebGLRenderer({canvas: CANVAS, antialias: true,});

    renderer.setPixelRatio( 0.8 );



    renderer.setSize( window.innerWidth, window.innerHeight );

    renderer.outputEncoding = THREE.sRGBEncoding;

    renderer.shadowMapEnabled = true;



    camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 14000 );

function setUpLevelModel(levelName, offset) {

    let ran = rand(1,3);

    if (offset == max) {

        ran = 4;

    }

    let lvl = eval(nextLevelBlock+"["+ran+"].model.clone()");

    if ( nextLevelBlock == "level_top" && offset != 1){

        nextZ += 16;

        lvl.position.z = nextZ;



        if (doLeft){

            lvl.position.x = nextX2;

            doLeft = false;

        } else {

            lvl.position.x = nextX*-1;

        }

    }

    else if ( nextLevelBlock == "level_right" && offset != 1){

        nextX += 16;

        lvl.position.z = nextZ;

        lvl.position.x = nextX*-1;

    }

    else if ( nextLevelBlock == "level_left" && offset != 1){

        nextX2 += 16;

        lvl.position.z = nextZ;

        lvl.position.x = nextX2;

        doLeft = true;

    }

    else if (offset == 1){

        nextZ += 16;

        lvl.position.z += 16;

    }

    lvl.scale.set(0.01,0.01,0.01);

    lvl.traverse(function ( child ) {

        if ( child instanceof THREE.Mesh ) {

            const oldMat = child.material;

            child.material = new THREE.MeshLambertMaterial( {  color: oldMat.color, map: oldMat.map });

            child.castShadow = true;

            child.receiveShadow = true;

            if(oldMat.name == "Wall"){

                collidersArray.push(child);

                child.box3 = new THREE.Box3();

                child.box3.setFromObject(child);

                child.boundingBox = new THREE.BoxHelper(child, 0x00ff00);

                //scene.add(child.boundingBox);

                child.enemy = false;

                child.player = false;

                child.dead = true;

                enemiesCollisionArray.push(child);

                playerDetectionArray.push(child);

            }

            else if(oldMat.name == "spawnPlayer"){

                child.getWorldPosition(playerSpawnPos);

                playerSpawnPos.x *= 0.01;

                playerSpawnPos.y = 0.1;

                playerSpawnPos.z *= 0.01;

                playerSpawnPos.z += nextZ;

                if ( nextLevelBlock == "level_left" ){

                    playerSpawnPos.x += nextX2;

                }

                else {

                    playerSpawnPos.x += nextX*-1;

                }

                child.visible = false;

            }

            else if(oldMat.name == "spawnEnemy_Static"){

                let t = new THREE.Vector3();

                child.getWorldPosition(t);

                t.x *= 0.01;

                t.y = 0.1;

                t.z *= 0.01;

                t.z += nextZ;

                if ( nextLevelBlock == "level_left" ){

                    t.x += nextX2;

                }

                else {

                    t.x += nextX*-1;

                }



                let data = {

                    spawnPos: t,

                    type: 0,

                }

                enemySpawnPos.push(data);

                child.visible = false;

            }

            else if(oldMat.name == "spawnEnemy_Horizontal"){

                let t = new THREE.Vector3();

                child.getWorldPosition(t);

                t.x *= 0.01;

                t.y = 0.1;

                t.z *= 0.01;

                t.z += nextZ;

                if ( nextLevelBlock == "level_left" ){

                    t.x += nextX2;

                }

                else {

                    t.x += nextX*-1;

                }

                let data = {

                    spawnPos: t,

                    type: 1,

                }

                enemySpawnPos.push(data);

                child.visible = false;

            }

            else if(oldMat.name == "spawnEnemy_Vertical"){

                let t = new THREE.Vector3();

                child.getWorldPosition(t);

                t.x *= 0.01;

                t.y = 0.1;

                t.z *= 0.01;

                t.z += nextZ;

                if ( nextLevelBlock == "level_left" ){

                    t.x += nextX2;

                }

                else {

                    t.x += nextX*-1;

                }

                let data = {

                    spawnPos: t,

                    type: 2,

                }

                enemySpawnPos.push(data);

                child.visible = false;

            }

        }

    });



    let half = eval(nextLevelBlock+"["+ran+"].exit");

    nextLevelBlock = "level_"+half;

    scene.add(lvl);

}



function Player(spawnPos) {

        speed: 5,

        dead: false,

    }

    self.init = function(){

        // model

        self.group = new THREE.Object3D();

        scene.add(self.group);

        self.model = THREE.SkeletonUtils.clone(BaseModel.ninja.fbx);

        self.group.add(self.model);

        self.group.position.copy(spawnPos);



        self.model.traverse(function ( child ) {

            if ( child instanceof THREE.Mesh ) {

                const oldMat = child.material;

                child.material = new THREE.MeshBasicMaterial( {  map: oldMat.map, skinning: true, color: oldMat.color, side: THREE.DoubleSide });

            }

        });

        self.model.scale.set(0.01,0.01,0.01);

        //self.model.rotation.y = -90 * Math.PI/180;



        self.mixer = new THREE.AnimationMixer(self.model);

        const firstClip = Anims.ninja_idle.animation

        self.idle = self.mixer.clipAction(firstClip);

        const secondClip = Anims.ninja_walk.animation;

        self.walk = self.mixer.clipAction(secondClip);

        const thirdClip = Anims.ninja_attack.animation;

        self.attack = self.mixer.clipAction(thirdClip);

        self.attack.timeScale = 2;

        const fourthClip = Anims.ninja_die.animation;

        self.die = self.mixer.clipAction(fourthClip);

        self.idle.play();



        self.attack.setLoop( THREE.LoopOnce );

        self.attack.clampWhenFinished = true;

        self.die.setLoop( THREE.LoopOnce );

        self.die.clampWhenFinished = true;



        self.attack._clip.name = "attack";

        self.die._clip.name = "die";

        self.mixer.addEventListener( 'finished', function( e ) {

            if (e.action._clip.name == "die"){

                // game Over

            }

            else if (e.action._clip.name == "attack"){

                self.mixer.stopAllAction();

                self.idle.fadeIn(0.1);

                self.idle.play();

            }

        });



        //Shadow

        var circleGeometry = new THREE.CircleGeometry(1.5, 5, 15);

        var shadowMaterial = new THREE.MeshBasicMaterial({

            map: Textures.shadow.texture,

            transparent: true,

            opacity: 0.4,

            side: THREE.DoubleSide,

        });

        self.shadow = new THREE.Mesh(circleGeometry, shadowMaterial);

        self.shadow.rotation.x = -1.57;

        self.group.add(self.shadow);

        self.shadow.position.y = 0.1;



        // boundingbox

        const material = new THREE.MeshBasicMaterial({visible: false});

        self.box = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3, 1.5), material);

        self.box.position.y += 1;

        self.group.add(self.box);

        self.boundingBox = new THREE.BoxHelper(self.box, 0x00ff00);

        //scene.add(self.boundingBox);

        self.box3 = new THREE.Box3().setFromObject(self.box);



        // hitbox

        self.hitbox = new THREE.Mesh(new THREE.BoxGeometry(1.7, 3, 1.7), material);

        self.hitbox.position.y += 1;

        self.hitbox.player = true;

        playerDetectionArray.push(self.hitbox);

        self.group.add(self.hitbox);



        self.raycaster = new THREE.Raycaster();

    }

    self.move = function(delta) {

        if (self.attack.isRunning()) return;

        self.group.rotation.y = playerAngle * (Math.PI/180);



        if (playerMove){

            self.group.translateZ(playerSpeed*delta);

            if (!self.attack.isRunning() && !self.walk.isRunning() && !gameOver) {

                self.mixer.stopAllAction();

                self.walk.fadeIn(0.2);

                self.walk.play();

            }

        }

        else if (!self.attack.isRunning() && !self.idle.isRunning() && !gameOver){

            self.mixer.stopAllAction();

            self.idle.fadeIn(0.2);

            self.idle.play();

        }



        self.collisionCheck();



        var worldPos = self.group.getWorldPosition(new THREE.Vector3());

        worldPos.z -= 20;

        worldPos.y += 18;

        camera.position.lerp(worldPos, 0.05);

        pos = self.group.position.clone();

        pos.y += 1;

        pos.z += 3;

        camera.lookAt(pos);

    }

    self.collisionCheck = function() {

        for (let i in collidersArray){

            let child = collidersArray[i];

            let collision = self.box3.intersectsBox(child.box3);

            if (collision){



                var overlapX = Math.min( self.box3.max.x, child.box3.max.x ) - Math.max( self.box3.min.x, child.box3.min.x );



                if ( overlapX < 0 ) return false;



                var overlapY = Math.min( self.box3.max.y, child.box3.max.y ) - Math.max( self.box3.min.y, child.box3.min.y );



                if ( overlapY < 0 ) return false;



                var overlapZ = Math.min( self.box3.max.z, child.box3.max.z ) - Math.max( self.box3.min.z, child.box3.min.z );



                if ( overlapZ < 0 ) return false;



                var minOverlap = Math.min( overlapX, overlapZ );

                var x = y = z = 0;



                switch ( minOverlap ) {



                    case overlapX:



                        x = Math.sign( self.box3.min.x + self.box3.max.x - child.box3.min.x - child.box3.max.x );

                        self.group.position.x += (x * minOverlap);

                        break;



                    case overlapY:



                        y = Math.sign( self.box3.min.y + self.box3.max.y - child.box3.min.y - child.box3.max.y );

                        break;



                    case overlapZ:



                        z = Math.sign( self.box3.min.z + self.box3.max.z - child.box3.min.z - child.box3.max.z );

                        self.group.position.z += (z * minOverlap);

                        break;

                }

            }

        }

    }

    self.attackCheck = function() {

        var dir = new THREE.Vector3();

        self.group.getWorldDirection(dir).normalize();



        var pos = self.group.position.clone();

        pos.y = 1;



        self.raycaster.set(pos,dir);



        if (enemiesCollisionArray !== undefined){

            const intersect = self.raycaster.intersectObjects(enemiesCollisionArray);

            if (intersect.length>0){



                if (intersect[0].distance<1 && intersect[0].object.enemy){

                    let child = null;

                    for (let i in enemiesArray){

                        if (enemiesArray[i].box.uuid == intersect[0].object.uuid){

                            child = enemiesArray[i];

                        }

                    }

                    if (child.dead == false) {

                        Sound.attack1.sound.play();

                        Sound.attack2.sound.play();

                        enemiesLeft --;

                        if (enemiesLeft < 1){

                            gameOverFunction(1);

                        }

                        ENEMIES_COUNTER.innerHTML = 'x'+enemiesLeft;

                        child.dead = true;

                        let ss = rand(50,100);

                        score += ss;

                        SCORE_TEXT.innerHTML = "Điểm: "+score;

                        scoreFX();

                        let s = new ScoreText(child.group.position, ss);

                        child.mixer.stopAllAction();

                        child.die.fadeIn(0.2);

                        child.die.play();

                        child.vision.visible = false;

                        let b = new BloodFX(child.group.position);

                        self.mixer.stopAllAction();

                        self.attack.fadeIn(0.2);

                        self.attack.play();

                        child.shadow.visible = false;

                        screenShakeTime = time;

                        if (level == 1){

                            TUT1.style.visibility = "hidden";

                            TUT2.style.visibility = "hidden";

                        }

                    }

                }

            }

        }

    }

    self.update = function(delta) {

        self.mixer.update(delta);

        self.boundingBox.setFromObject(self.box);

        self.box3.setFromObject(self.box);



        if (!self.dead){

            self.move(delta);

            self.attackCheck();

        }

    }



    self.init();

    updateArray.push(self);

    return self;

}

        }

        else if (self.moveDir == -2){

            self.group.position.z -= self.speed*delta;

            var targetRotation = 3;

            self.group.rotation.y = THREE.Math.lerp( self.group.rotation.y, targetRotation, 0.2  );

        }



        if (self.moveDir == 1){

            var targetRotation = 4.6;

            self.group.rotation.y = THREE.Math.lerp( self.group.rotation.y, targetRotation, 0.2  );

        }

        else if (self.moveDir == -1){

        }



        self.collisionCheck();

                if (self.collisionCooldown < 0) {

                    self.moveDir *= -1;

                    self.collisionCooldown = 30;

                }



                var overlapX = Math.min( self.box3.max.x, child.box3.max.x ) - Math.max( self.box3.min.x, child.box3.min.x );

                if ( overlapX < 0 ) return false;



                var overlapY = Math.min( self.box3.max.y, child.box3.max.y ) - Math.max( self.box3.min.y, child.box3.min.y );

                if ( overlapY < 0 ) return false;



                var overlapZ = Math.min( self.box3.max.z, child.box3.max.z ) - Math.max( self.box3.min.z, child.box3.min.z );

                if ( overlapZ < 0 ) return false;



                var minOverlap = Math.min( overlapX, overlapZ );

                var x = y = z = 0;



                switch ( minOverlap ) {



                    case overlapX:



                        x = Math.sign( self.box3.min.x + self.box3.max.x - child.box3.min.x - child.box3.max.x );

                        self.group.position.x += (x * minOverlap);

                        break;



                    case overlapY:



                        y = Math.sign( self.box3.min.y + self.box3.max.y - child.box3.min.y - child.box3.max.y );

                        break;



                    case overlapZ:



                        z = Math.sign( self.box3.min.z + self.box3.max.z - child.box3.min.z - child.box3.max.z );

                        self.group.position.z += (z * minOverlap);

                        break;

                }

            }

        }

    }

    self.shoot = function () {

        var dir = new THREE.Vector3();

        self.group.getWorldDirection(dir).normalize();



        var pos = self.group.position.clone();

        pos.y = 1;



        self.raycaster.set(pos,dir);



        if (playerDetectionArray !== undefined){

            const intersect = self.raycaster.intersectObjects(playerDetectionArray);

            if (intersect.length>0){

                if (intersect[0].distance<5.5 && !player.dead && intersect[0].object.player){

                    gameOverFunction(0);

                    screenShakeTime = time;

                    player.dead = true;

                    player.mixer.stopAllAction();

                    player.die.fadeIn(0.2);

                    player.die.play();

                    let b = new BloodFX(player.group.position);

                    let v1 = new THREE.Vector3().copy(self.group.position);

                    v1.y = 1.5;

                    let v2 = new THREE.Vector3().copy(player.group.position);

                    v2.y = 1.5;

                    let t = new BulletTrail(v1, v2);

                    self.mixer.stopAllAction();

                    self.attack.fadeIn(0.2);

                    self.attack.play();

                    let v = new THREE.Vector3().copy(self.group.position);

                    v.y += 1;

                    self.muzzle.visible = true;

                    self.alertSprite.visible = true;

                    setTimeout(function(){

                        self.muzzle.visible = false;

                    },100);

                }

            }

        }

    }

    self.update = function(delta) {

        self.mixer.update(delta);

        self.boundingBox.setFromObject(self.box);

        self.box3.setFromObject(self.box);

        self.collisionCooldown --;

        if (!self.dead){

            self.move(delta);

            self.shoot ();

        }

        self.sin += 0.07;

        self.alertSprite.scale.y -= Math.sin(self.sin)*0.01;

    }



    self.init();

    updateArray.push(self);

    enemiesArray.push(self);

    return self;

}

function ScoreText(spawnPos, text) {

    var self = {

        timer: 0,

    }

    self.init = function(){

        let tt = '+'+text;

        const ctx = document.createElement('canvas').getContext('2d');

        const borderSize = 2;

        const font =  `700 30px Arial`;

        ctx.font = font;

        // measure how long the name will be

        const textWidth = ctx.measureText(tt).width;

        const doubleBorderSize = borderSize * 2;

        const width = 50 + doubleBorderSize;

        const height = 30 + doubleBorderSize;

        ctx.canvas.width = width;

        ctx.canvas.height = height;

        ctx.font = font;



        // need to set font again after resizing canvas

        ctx.textBaseline = 'middle';

        ctx.textAlign = 'center';

        // scale to fit but don't stretch

        const scaleFactor = Math.min(1, 50 / textWidth);

        ctx.translate(width / 2, height / 2);

        ctx.scale(scaleFactor, 1);

        ctx.fillStyle = '#FFFF00';

        ctx.strokeStyle = '#000000';

        ctx.lineWidth = 3;

        ctx.strokeText(tt, 0, 0);

        ctx.fillText(tt, 0, 0);



        const texture = new THREE.CanvasTexture(ctx.canvas);

        texture.encoding = THREE.sRGBEncoding;

        texture.minFilter = THREE.LinearFilter;

        texture.wrapS = THREE.ClampToEdgeWrapping;

        texture.wrapT = THREE.ClampToEdgeWrapping;

        spriteMaterial = new THREE.SpriteMaterial({map:texture});

        self.nameSprite = new THREE.Sprite(spriteMaterial);

        scene.add(self.nameSprite);

        const labelBaseScale = 0.01;

        self.nameSprite.scale.x =  2;

        self.nameSprite.scale.y =  1;

        let vec = new THREE.Vector3().copy(spawnPos);



        self.nameSprite.position.copy(vec);

    }

    self.update = setInterval(function(){



        self.nameSprite.position.y += 0.1;

        self.timer ++;

        if (self.timer > 40){

            scene.remove(self.nameSprite);

            clearInterval(self.update);

        }

    },1000/60);



    self.init();

    return self;

}

function callConfetti() {

    var duration = 2 * 50;

    var end = Date.now() + duration;



    (function frame() {

        // launch a few confetti from the left edge

        confetti({

            particleCount: 7,

            angle: 60,

            spread: 55,

            origin: { x: 0 }

        });

        // and launch a few from the right edge

        confetti({

            particleCount: 7,

            angle: 120,

            spread: 55,

            origin: { x: 1 }

        });



        // keep going until we are out of time

        if (Date.now() < end) {

            requestAnimationFrame(frame);

        }

    }());



    confetti({

        particleCount: 150,

        spread: 180

    });

}

function BloodFX(spawnPos){

    var self = {

        particles: [],

        max: 6,

        mesh: null,

        index: null,

    }

    self.init = function() {

        let geo = new THREE.Geometry();

        for(let i=0; i<self.max; i++) {

            let particle = {

                position: new THREE.Vector3(

                      randFloat(-0.1,0.1),

                      randFloat(-0.1,0.1),

                      randFloat(-0.1,0.1)),

                velocity: new THREE.Vector3(

                      randFloat(-0.05,0.05),

                      randFloat(0.1,0.2),

                      randFloat(-0.05,0.05)),

                acceleration: new THREE.Vector3(0, -0.005, 0),

            }

            self.particles.push(particle)

            geo.vertices.push(particle.position)

        }

        var mat = new THREE.PointsMaterial({color:0xFF0000,size: 1.5, map: Textures.blood.texture, opacity: 0.7, transparent: true, })

        self.mesh = new THREE.Points(geo,mat)

        self.mesh.position.copy(spawnPos);

        scene.add(self.mesh);

    }

    self.update = function(){

        self.particles.forEach(p => {

            p.velocity.add(p.acceleration);

            p.position.add(p.velocity);

            self.mesh.material.size -= 0.001;

        })

        self.mesh.geometry.verticesNeedUpdate = true;

        if (self.mesh.material.size < 0){

            scene.remove(self.mesh);

            for (let i in particleArray){

                if (particleArray[i].mesh.uuid == self.mesh.uuid)

                    particleArray.splice(i,1);

            }

        }

    }



    self.init();

    updateArray.push(self);

    particleArray.push(self);

    return self;

}



function BulletTrail(startVec, endVec) {

    var self = {

        mesh: null,

        nEnd: 0,

        nMax: 0,

        nStep: 90,// 30 faces * 3 vertices/face

        mat: null,

        id: Math.random()*100,

    }

    self.init = function(){

        let curve = new THREE.LineCurve3(

            startVec,

            endVec

        );

        let bGeometry = new THREE.TubeBufferGeometry(curve, 6, 0.2, 6, false);

        //let bGeometry = new THREE.BufferGeometry().fromGeometry( baseGeometry );

        self.mat = new THREE.MeshBasicMaterial({ color: 0xfa7d09, transparent: true, opacity: 1, side: THREE.DoubleSide});

        self.mesh = new THREE.Mesh(bGeometry, self.mat);



        self.nMax = self.mesh.geometry.drawRange.count;



        scene.add(self.mesh);

    }

    self.update = function(){

        if (self.mesh){

            if (self.nEnd < self.nMax){

                self.nEnd += 5;

                self.nStep = self.nEnd;

                if (self.nStep > self.nMax){

                    self.nStep = self.nMax;

                }

            }

            else {

                scene.remove(self.mesh);

                for (let i in trailArray) {

                    if (trailArray[i].id == self.id){

                        trailArray.splice(i,1);

                    }

                }

            }

            self.mesh.geometry.setDrawRange( self.nEnd, self.nStep );

        }

    }

    self.init();

    trailArray.push(self);

    return self;

}

function onWindowResize() {

    camera.aspect = window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();



    renderer.setSize( window.innerWidth, window.innerHeight );

}



function rand(min, max) {

    min = Math.ceil(min);

    max = Math.floor(max);

    return Math.floor(Math.random() * (max - min + 1)) + min; //The maximum is inclusive and the minimum is inclusive

}



function randFloat(min, max) {

  return Math.random() * (max - min) + min;

}

// --GAME LOOP-- //



function animate(){

    requestAnimationFrame( animate );

    var delta = clock.getDelta();

    if (delta > 2){

        delta = 0;

    }



    for (let i in updateArray){

        updateArray[i].update(delta);

    }

    for (let i in collidersArray){

        collidersArray[i].boundingBox.setFromObject(collidersArray[i]);

        collidersArray[i].box3.setFromObject(collidersArray[i]);

    }

    for (let i in trailArray){

        trailArray[i].update(delta);

    }

    // shake camera



    time = new Date().getTime();

    if (time < (screenShakeTime+300)) {

        var factor = ((screenShakeTime+1800)-time)/2400;

        var noise = ((Math.random()*2)-2)*factor;

        camera.position.y += noise/4;

        camera.position.z -= noise/3;

    }



    renderer.render( scene, camera );

}
