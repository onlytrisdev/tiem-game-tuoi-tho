            function RewardedShow(id) {
                console.log('GV_AD_REWARD_PATCHED');
                var rewardId = id;
                var settled = false;
                function send(method, arg) {
                    try {
                        if (!myGameInstance) return;
                        if (arg == null) myGameInstance.SendMessage('YandexGame', method);
                        else myGameInstance.SendMessage('YandexGame', method, String(arg));
                    } catch (e) {}
                }
                function closeOnly() {
                    console.log('Closed Video Ad. Id: ' + rewardId);
                    send('CloseVideo');
                    FocusGame();
                }
                function grant() {
                    console.log('Reward Video Ad. Id: ' + rewardId);
                    send('RewardVideo', rewardId);
                    send('CloseVideo');
                    FocusGame();
                }
                function finish(reward) {
                    if (settled) return;
                    settled = true;
                    console.log('GV_AD_BREAK_DONE');
                    if (reward) grant();
                    else closeOnly();
                }
                send('OpenVideo');
                var adFn = (typeof GVAdBreak === "function") ? GVAdBreak : null;
                var stub = !adFn;
                try {
                    if (adFn && String(adFn).indexOf("Không hỗ trợ") >= 0) stub = true;
                } catch (e) {
                    stub = true;
                }
                if (stub) {
                    console.log('GV_ADBREAK_MISSING');
                    if (LocalHost()) grant();
                    else closeOnly();
                    return;
                }
                console.log('GV_AD_BREAK_START');
                var sawHidden = false;
                function onVisibility() {
                    if (document.hidden) {
                        sawHidden = true;
                        return;
                    }
                    if (!sawHidden) return;
                    document.removeEventListener('visibilitychange', onVisibility);
                    setTimeout(function () {
                        if (settled) return;
                        console.log('GV_ADBREAK_VISIBILITY_FALLBACK');
                        finish(false);
                    }, 800);
                }
                document.addEventListener('visibilitychange', onVisibility);
                try {
                    GVAdBreak(function () {
                        setTimeout(function () {
                            requestAnimationFrame(function () { finish(true); });
                        }, 0);
                    });
                } catch (err) {
                    console.log('GV_ADBREAK_FAIL');
                    document.removeEventListener('visibilitychange', onVisibility);
                    if (LocalHost()) grant();
                    else closeOnly();
                }
            }

            function GetLeaderboardScores(nameLB, maxPlayers, quantityTop, quantityAround, photoSize, auth) {
                try
                {
                    var jsonEntries = {
                        technoName: '',
                        isDefault: false,
                        isInvertSortOrder: false,
                        decimalOffset: 0,
                        type: '' // , title: ''
                    };

                    ysdk.getLeaderboards()
                        .then(leaderboard => leaderboard.getLeaderboardDescription(nameLB))
                        .then(res => {
                            jsonEntries.technoName = nameLB;
                            jsonEntries.isDefault = res.default;
                            jsonEntries.isInvertSortOrder = res.description.invert_sort_order;
                            jsonEntries.decimalOffset = res.description.score_format.options.decimal_offset;
                            jsonEntries.type = res.description.type; // Не определяется на момент 18.07.23
                            //jsonEntries.title = res.title; // Реализуйте по предпочтениям

                            return leaderboard.getLeaderboardEntries(nameLB, {
                                quantityTop: quantityTop,
                                includeUser: auth,
                                quantityAround: quantityAround
                            });
                        })
                        .then(res => {
                            let jsonPlayers = EntriesLB(res, maxPlayers, photoSize);
                            let combinedJson = { ...jsonEntries, ...jsonPlayers };

                            myGameInstance.SendMessage('YandexGame', 'LeaderboardEntries', JSON.stringify(combinedJson));
                        })
                        .catch(error => {
                            console.error(error);
                        });
                }
                catch (e)
                {
                    console.error('CRASH Get Leaderboard: ', e.message);
                }
            }

            function EntriesLB(res, maxPlayers, photoSize) {
                let LeaderboardEntriesText = '';
                let playersCount;

                if (res.entries.length < maxPlayers)
                {
                    playersCount = res.entries.length;
                } else
                {
                    playersCount = maxPlayers;
                }

                let ranks = new Array(playersCount);
                let photos = new Array(playersCount);
                let mames = new Array(playersCount);
                let scores = new Array(playersCount);
                let uniqueIDs = new Array(playersCount);

                for (i = 0; i < playersCount; i++)
                {
                    ranks[i] = res.entries[i].rank;
                    scores[i] = res.entries[i].score;
                    uniqueIDs[i] = res.entries[i].player.uniqueID;

                    if (photoSize === 'nonePhoto' || res.entries[i].player.scopePermissions.avatar !== "allow")
                    {
                        photos[i] = 'nonePhoto';
                    } else
                    {
                        photos[i] = res.entries[i].player.getAvatarSrc(photoSize);
                    }

                    if (res.entries[i].player.scopePermissions.public_name !== "allow")
                    {
                        mames[i] = "anonymous";
                    } else
                    {
                        mames[i] = res.entries[i].player.publicName;
                    }

                    LeaderboardEntriesText += ranks[i] + '. ' + mames[i] + ": " + scores[i] + '\n';
                }

                if (playersCount === 0)
                {
                    LeaderboardEntriesText = 'no data';
                }

                let jsonPlayers = {
                    "entries": LeaderboardEntriesText,
                    "ranks": ranks,
                    "photos": photos,
                    "names": mames,
                    "scores": scores,
                    "uniqueIDs": uniqueIDs
                };

                return jsonPlayers;
            }

            function LoadCloud(sendback) {
                return new Promise((resolve) => {
                    try {
                        if (window.ArcadeSave && ArcadeSave.getYgLoadPayload) {
                            var ygPayload = ArcadeSave.getYgLoadPayload();
                            if (ygPayload) {
                                if (sendback && myGameInstance)
                                    myGameInstance.SendMessage('YandexGame', 'SetLoadSaves', ygPayload);
                                else if (sendback && window.ArcadeSave && ArcadeSave.queueYgLoad)
                                    ArcadeSave.queueYgLoad();
                                resolve(ygPayload);
                                return;
                            }
                        }
                    } catch (e) {}
                    if (ysdk == null)
                    {
                        if (window.ArcadeSave && ArcadeSave.skipNoData && ArcadeSave.skipNoData())
                        {
                            resolve('');
                            return;
                        }
                        if (sendback)
                            myGameInstance.SendMessage('YandexGame', 'SetLoadSaves', 'noData');
                        resolve('noData');
                        return;
                    }
                    try
                    {
                        ysdk.getPlayer({ scopes: false })
                            .then(_player => {
                                _player.getData(["saves"]).then(data => {
                                    if (data.saves)
                                    {
                                        if (sendback)
                                            myGameInstance.SendMessage('YandexGame', 'SetLoadSaves', JSON.stringify(data.saves));
                                        resolve(JSON.stringify(data.saves));
                                    } else
                                    {
                                        if (sendback)
                                            myGameInstance.SendMessage('YandexGame', 'SetLoadSaves', 'noData');
                                        resolve('noData');
                                    }
                                }).catch(() => {
                                    console.error('Load Cloud Error!');
                                    if (sendback)
                                        myGameInstance.SendMessage('YandexGame', 'SetLoadSaves', 'noData');
                                    resolve('noData');
                                });
                            }).catch(e => {
                                console.error('Load Cloud Error!', e.message);
                                if (sendback)
                                    myGameInstance.SendMessage('YandexGame', 'SetLoadSaves', 'noData');
                                resolve('noData');
                            });
                    }
                    catch (e)
                    {
                        console.error('CRASH Load saves Cloud: ', e.message);
                        if (sendback)
                            myGameInstance.SendMessage('YandexGame', 'SetLoadSaves', 'noData');
                        resolve('noData');
                    }
                });
            }

                                "playerPhoto": "null"
                            });
                            console.log('GV_AUTH_SHIM playerId=' + ArcadeSave.getPlayerId());
                            if (ArcadeSave.noteAuthShim) ArcadeSave.noteAuthShim();
                            if (sendback && myGameInstance)
                                myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', gvAuth);
                            resolve(gvAuth);
                        }
                        else if (ysdk == null)
                        {
                            NotAuthorized();
                            if (sendback)
                                myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', NotAuthorized());
                            resolve(NotAuthorized());
                        }
                        else
                        {
                            let _scopes = false;
                            ysdk.getPlayer({ scopes: _scopes })
                                .then(_player => {
                                    player = _player;

                                    let playerName = player.getName();
                                    let playerPhoto = player.getPhoto('small');

                                    if (!_scopes)
                                    {
                                        playerName = "anonymous";
                                        playerPhoto = "null";
                                    }

                                    if (player.getMode() === 'lite')
                                    {

                                        console.log('Not Authorized');
                                        if (sendback)
                                            myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', NotAuthorized());
                                        resolve(NotAuthorized());
                                    } else
                                    {
                                        let authJson = {
                                            "playerAuth": "resolved",
                                            "playerName": playerName,
                                            "playerId": player.getUniqueID(),
                                            "playerPhoto": playerPhoto
                                        };
                                        if (sendback)
                                            myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', JSON.stringify(authJson));
                                        resolve(JSON.stringify(authJson));
                                    }
                                }).catch(e => {
                                    console.error('Authorized err: ', e.message);
                                    if (sendback)
                                        myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', NotAuthorized());
                                    resolve(NotAuthorized());
                                });
                        }
                    } catch (e)
                    {
                        console.error('CRASH init Player: ', e.message);
                        if (sendback)
                            myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', NotAuthorized());
                        resolve(NotAuthorized());
                    }
                });
            }

            function NotAuthorized() {
                let authJson = {
                    "playerAuth": "rejected",
                    "playerName": "unauthorized",
                    "playerId": "unauthorized",
                    "playerPhoto": "null"
                };
                return JSON.stringify(authJson);
            }

            function OpenAuthDialog() {
                if (ysdk !== null)
                {
                    try
                    {
                        ysdk.auth.openAuthDialog().then(() => {
                            InitPlayer(true)
                                .then(() => {
                                    myGameInstance.SendMessage('YandexGame', 'GetDataInvoke');
                                });
                        });
                    } catch (e)
                    {
                        console.log('CRASH Open Auth Dialog: ', e.message);
                    }
                }
            }


            document.body.appendChild(script);
        </script>
    </body>

</html>
