<script>

    const hideFullScreenButton = "";

    const buildUrl = "Build";

    const loaderUrl = buildUrl + "/WebGL.loader.js";

    const config = {

        dataUrl: buildUrl + "/WebGL.data.unityweb",

        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",

        codeUrl: buildUrl + "/WebGL.wasm.unityweb",

        streamingAssetsUrl: "StreamingAssets",

        companyName: "YG",

        productName: "Shopping Business",

        productVersion: "1.0.4",

    };



    const container = document.querySelector("#unity-container");

    const canvas = document.querySelector("#unity-canvas");

    const loadingCover = document.querySelector("#loading-cover");

    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");

    const progressBarFull = document.querySelector("#unity-progress-bar-full");

    const spinner = document.querySelector('.spinner');



    const canFullscreen = (function () {

        for (const key of [

            'exitFullscreen',

            'webkitExitFullscreen',

            'webkitCancelFullScreen',

            'mozCancelFullScreen',

            'msExitFullscreen',

        ]) {

            if (key in document) {

                return true;

            }

        }

        return false;

    }());



    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

        container.className = "unity-mobile";

        

    }



    

    canvas.style.background = "url('background.png') center / cover";



    loadingCover.style.display = "";



    canvas.addEventListener("touchstart", () => { window.focus() });

    canvas.addEventListener("pointerdown", () => { window.focus() }); 



    let player;

    let leaderboard;

    let myGameInstance = null;

    let payments = null;

    let promptCanShow = false;

    let reviewCanShow = false;

    let initSDK = true;

    let initGame = true;

    let photoSizeForInit;

    let scopesForInit;

    let firstAd = true;



    const script = document.createElement("script");

    script.src = loaderUrl;

    const gvUnityQueue = [];

    function gvSendUnity(objectName, methodName, value) {

        if (!myGameInstance) {

            gvUnityQueue.push([objectName, methodName, value]);

            return;

        }

        try {

            if (value === undefined) myGameInstance.SendMessage(objectName, methodName);

            else myGameInstance.SendMessage(objectName, methodName, String(value));

        } catch (e) {

            console.warn("[Arcade] GV_UNITY_SEND_FAIL", methodName, e.message);

        }

    }

    function gvFlushUnityQueue() {

        while (myGameInstance && gvUnityQueue.length) {

            const command = gvUnityQueue.shift();

            gvSendUnity(command[0], command[1], command[2]);

        }

    }

    script.onload = () => {

        // Production: never silently let an unauthenticated guest create

        // unsynchronized progress that looks like a Arcade account save.

        if (ArcadeSave.isProduction() && !ArcadeSave.isAuthenticated() &&

            new URLSearchParams(location.search).get("gvsave") !== "0") {

            loadingCover.style.display = "none";

            document.getElementById("gv-auth-gate").hidden = false;

            console.warn("[Arcade] GV_AUTH_REQUIRED");

            return;

        }

        let booted = false;

        const bootUnity = () => {

            if (booted) return;

            booted = true;

            window.__gvUnityBooted = true;

            createUnityInstance(canvas, config, (progress) => {

                spinner.style.display = "none";

                progressBarEmpty.style.display = "";

                progressBarFull.style.width = `${100 * progress}%`;

            }).then((unityInstance) => {

                myGameInstance = unityInstance;

                loadingCover.style.display = "none";

                ArcadeSave.onUnityReady(unityInstance);

                gvFlushUnityQueue();

                gvSyncActionPosition();

            }).catch((message) => {

                console.error("[Arcade] GV_UNITY_BOOT_FAIL", message);

            });

        };

        const watchdog = setTimeout(() => {

            console.warn("[Arcade] GV_BOOT_WATCHDOG");

            bootUnity();

        }, 14000);

        ArcadeSave.init().then(() => {

            clearTimeout(watchdog);

            if (!booted) bootUnity();

            else if (ArcadeSave.getState().cloudApplied) {

                const key = "gv_shop_late_seed:" + location.pathname;

                if (!sessionStorage.getItem(key)) {

                    sessionStorage.setItem(key, "1");

                    console.warn("[Arcade] GV_SEED_RELOAD");

                    location.reload();

                }

            }

        }).catch((error) => {

            clearTimeout(watchdog);

            console.error("[Arcade] GV_INIT_FAILURE", error);

            bootUnity();

        });

    };

 



    function InitSDK(photoSize, scopes) {

        console.log('Init GAME');

        initGame = true;

        photoSizeForInit = photoSize;

        scopesForInit = scopes;



        // if (initSDK == true) {

        //     ysdk.features.LoadingAPI?.ready();

            InitPlayer(photoSize, scopes);

        // }

    }



    function NotAuthorized() {

        try {

            console.log('Authorized failed');

            let authJson = {

                "playerAuth": "rejected",

                "playerName": "unauthorized",

                "playerId": "unauthorized",

                "playerPhoto": "null"

            };

            gvSendUnity('YandexGame', 'SetInitializationSDK', JSON.stringify(authJson));

        } catch (e) {

            console.error('CRASH Not Authorized: ', e.message);

        }

    }



    function InitPlayer(photoSize, _scopes) {

        if (ArcadeSave.isAuthenticated()) {

            const gid = new URLSearchParams(location.search).get("gid") ||

                        new URLSearchParams(location.search).get("gameId");

            const authJson = {

                playerAuth: "resolved",

                playerName: "Arcade Player",

                playerId: "gv_" + gid,

                playerPhoto: "null"

            };

            gvSendUnity("YandexGame", "SetInitializationSDK", JSON.stringify(authJson));

            console.log("[Arcade] GV_AUTH_SHIM");

        } else {

            NotAuthorized();

        }

        window.focus();

    }



    function OpenAuthDialog(photoSize, scopes) {

        try {

            ysdk.auth.openAuthDialog().then(() => {

                InitPlayer(photoSize, scopes);

            }).catch(() => {

                InitSDK(photoSize, scopes);

            });

        } catch (e) {

            console.log('CRASH Open Auth Dialog: ', e.message);

        }

    }



    // No automatic interstitials between Unity levels.

    function FullAdShow() {

        gvSendUnity("YandexGame", "CloseFullAd", "false");

        window.focus();

    }



    // Reward is granted ONLY from the Arcade rewarded-completion callback.

    function RewardedShow(id) {

        let ended = false;

        let rewarded = false;

        let wasHidden = false;

        const close = (success) => {

            if (ended) return;

            ended = true;

            document.removeEventListener("visibilitychange", onVisibility);

            clearTimeout(expire);

            if (success) gvSendUnity("YandexGame", "RewardVideo", String(id));

            else gvSendUnity("YandexGame", "ErrorVideo");

            gvSendUnity("YandexGame", "CloseVideo");

            window.focus();

        };

        const onVisibility = () => {

            if (document.hidden) wasHidden = true;

            else if (wasHidden && !rewarded && !ended) {

                // Tab regained focus without a rewarded-completion callback: no reward.

                setTimeout(() => { if (!rewarded) close(false); }, 800);

            }

        };

        document.addEventListener("visibilitychange", onVisibility);

        const expire = setTimeout(() => { if (!rewarded) close(false); }, 90000);

        gvSendUnity("YandexGame", "OpenVideo");

        const isDev = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);

        const stub = typeof window.GVAdBreak !== "function" ||

                     /Không hỗ trợ|not supported/i.test(String(window.GVAdBreak));

        if (stub) {

            console.warn("[Arcade] GV_ADBREAK_MISSING");

            if (isDev) { rewarded = true; close(true); }

            else close(false);

            return;

        }

        console.log("[Arcade] GV_AD_BREAK_START", id);

        try {

            GVAdBreak(() => {

                if (ended) return;

                rewarded = true;

                requestAnimationFrame(() => setTimeout(() => {

                    console.log("[Arcade] GV_AD_BREAK_DONE", id);

                    close(true);

                }, 0));

            });

        } catch (error) {

            console.warn("[Arcade] GV_ADBREAK_FAIL", error.message);

            close(false);

        }

    }



    function StickyAdActivity(show) {

        // Yandex banner disabled on Arcade. No game reward depends on banners.

    }



    function InitPayments() {

        try {

            ysdk.getPayments().then(_payments => {

                console.log('Purchases are available');

                payments = _payments;                

            }).catch(e => {

                console.log('Purchases are not available', e.message);

            })

        } catch (e) {

            console.error('CRASH Init Payments: ', e.message);

        }

    }



    function BuyPayments(id) {

        try {

            if (payments != null) {

                payments.purchase(id).then(purchase => {

                    console.log('Purchase Success');

                    myGameInstance.SendMessage('YandexGame', 'OnPurchaseSuccess', id);

                    window.focus();

                }).catch(e => {

                    console.error('Purchase Failed', e.message);

                    myGameInstance.SendMessage('YandexGame', 'OnPurchaseFailed', id);

                    window.focus();

                })

            } else {

                console.log('Payments == null');

            }

        } catch (e) {

            console.error('CRASH Buy Payments: ', e.message);

            window.focus();

        }

    }

    

    function GetPayments() {

        try {

            if (payments != null) {

                payments.getCatalog()

                    .then(products => {

                        let productID = [products.length];

                        let title = [products.length];

                        let description = [products.length];

                        let imageURI = [products.length];

                        let priceValue = [products.length];

                        let purchased = [products.length];

    

                        for (i = 0; i < products.length; i++) {

                            productID[i] = products[i].id;

                            title[i] = products[i].title;

                            description[i] = products[i].description;

                            imageURI[i] = products[i].imageURI;

                            priceValue[i] = products[i].priceValue;

                            purchased[i] = 0;

                        }

    

                        payments.getPurchases().then(purchases => {

                            for (i1 = 0; i1 < products.length; i1++) {

                                for (i2 = 0; i2 < purchases.length; i2++) {

                                    if (products[i1].id === purchases[i2].productID){

                                        purchased[i1]++;

                                    }

                                }

                            }

                        })

                            .then(() => {

                                var jsonPayments = {

                                    "id": productID,

                                    "title": title,

                                    "description": description,

                                    "imageURI": imageURI,

                                    "priceValue": priceValue,

                                    "purchased": purchased

                                };

                                myGameInstance.SendMessage('YandexGame', 'PaymentsEntries', JSON.stringify(jsonPayments));

                            })

                    });

            }

            else{

                console.log('Get Payments: payments == null');

            }

        } catch (e) {

            console.error('CRASH Get Payments: ', e.message);

        }

    }



    function DeletePurchase(id) {

        try {

            if (payments != null) {

                payments.getPurchases().then(purchases => {

                    for(i = 0; i < purchases.length; i++){

                        if (purchases[i].productID === id)

                            payments.consumePurchase(purchases[i].purchaseToken);

                    }

                });

            }

            else console.log('Delete Purchase: payments == null');

        } catch (e) {

            console.error('CRASH Delete Purchase: ', e.message);

        }

    }



    function DeleteAllPurchases() {

        try {

            if (payments != null) {

                payments.getPurchases().then(purchases => {

                    for(i = 0; i < purchases.length; i++){

                        payments.consumePurchase(purchases[i].purchaseToken);

                    }

                });

            }

            else console.log('Delete All Purchases: payments == null');

        } catch (e) {

            console.error('CRASH Delete All Purchases: ', e.message);

        }

    }



    // Preserve exact PluginYG save bytes; cloud adapter owns the Arcade API.

    function SaveCloud(jsonData, flush) {

        ArcadeSave.captureYG(jsonData, flush);

        if (flush) ArcadeSave.flush(true);

    }



    function LoadCloud() {

        ArcadeSave.deliverYG();

    }



    function InitLeaderboard() {

        try {

            ysdk.getLeaderboards().then(_lb => {

                leaderboard = _lb

                myGameInstance.SendMessage('YandexGame', 'InitializedLB');

            });

        } catch (e) {

            console.error('CRASH Init Leaderboard: ', e.message);

        }

    }



    function SetLeaderboardScores(_name, score) {

        try {

            ysdk.getLeaderboards()

                .then(leaderboard => {

                    leaderboard.setLeaderboardScore(_name, score);

                });

        } catch (e) {

            console.error('CRASH Set Leader board Scores: ', e.message);

        }

    }



    function GetLeaderboardScores(nameLB, maxPlayers, quantityTop, quantityAround, photoSize, auth) {

        if (auth) {

            try {

                ysdk.getLeaderboards()

                    .then(leaderboard => {

                        leaderboard.getLeaderboardEntries('' + nameLB, {

                            quantityTop: quantityTop,

                            includeUser: true,

                            quantityAround: quantityAround

                        })

                            .then(res => {

                                EntriesLB(res, nameLB, maxPlayers, photoSize);

                            });

                    });

            } catch (e) {

                console.error('CRASH Get Leaderboard Scores: ', e.message);

            }

        } else {

            try {

                ysdk.getLeaderboards()

                    .then(leaderboard => {

                        leaderboard.getLeaderboardEntries('' + nameLB, {quantityTop: quantityTop})

                            .then(res => {

                                EntriesLB(res, nameLB, maxPlayers, photoSize);

                            });

                    });

            } catch (e) {

                console.error('CRASH Get Leaderboard Scores: ', e.message);

            }

        }

    }



    function EntriesLB(res, nameLB, maxPlayers, photoSize) {

        let LeaderboardEntriesText = '';



        let playersCount;

        if (res.entries.length < maxPlayers) {

            playersCount = res.entries.length;

        } else {

            playersCount = maxPlayers;

        }



        let rank = [maxPlayers];

        let photo = [maxPlayers];

        let playersName = [maxPlayers];

        let scorePlayers = [maxPlayers];



        for (i = 0; i < playersCount; i++) {

            rank[i] = res.entries[i].rank;

            scorePlayers[i] = res.entries[i].score;



            if (photoSize === 'nonePhoto' || res.entries[i].player.scopePermissions.avatar !== "allow") {

                photo[i] = 'nonePhoto';

            } else {

                photo[i] = res.entries[i].player.getAvatarSrc(photoSize);

            }



            if (res.entries[i].player.scopePermissions.public_name !== "allow") {

                playersName[i] = "anonymous";

            } else {

                playersName[i] = res.entries[i].player.publicName;

            }



            LeaderboardEntriesText += rank[i] + '. ' + playersName[i] + ": " + scorePlayers[i] + '\n';

        }



        if (playersCount === 0) {

            LeaderboardEntriesText = 'No data';

        }



        let jsonLB = {

            "nameLB": nameLB,

            "entries": LeaderboardEntriesText,

            "rank": rank,

            "photo": photo,

            "playersName": playersName,

            "scorePlayers": scorePlayers

        };

        myGameInstance.SendMessage('YandexGame', 'LeaderboardEntries', JSON.stringify(jsonLB));

    }



    function LanguageRequest() {

        try {

            myGameInstance.SendMessage('YandexGame', 'SetLanguage', 'en');

        } catch (e) {

            console.error('CRASH Language Request: ', e.message);

        }

    }



    function RequestingEnvironmentData() {

        try {

            let jsonEnvir = {

                "language": 'en',

                 

            };

            myGameInstance.SendMessage('YandexGame', 'SetEnvironmentData', JSON.stringify(jsonEnvir));

        } catch (e) {

            console.error('CRASH Requesting Environment Data: ', e.message);

        }

    }



    function Review() {

        try {

            ysdk.feedback.canReview()

                .then(({ value, reason }) => {

                    if (value) {

                        ysdk.feedback.requestReview().then(({feedbackSent}) => {

                            console.log('feedbackSent ', feedbackSent);

                            if (feedbackSent)

                                myGameInstance.SendMessage('YandexGame', 'ReviewSent', 'true');

                            else myGameInstance.SendMessage('YandexGame', 'ReviewSent', 'false');

                            window.focus();

                        })

                    }

                    else {

                        console.log('reviewCanShow = false', reason)

                        window.focus();

                    }

                })

        } catch (e) {

            console.error('CRASH Review: ', e.message);

            window.focus();

        }

    }



    function PromptShow() {

        try {

            ysdk.shortcut.showPrompt()

                .then(result => {

                    console.log('Shortcut created?:', result);

                    if (result.outcome === 'accepted') {

                        console.log('Prompt Success');

                        myGameInstance.SendMessage('YandexGame', 'OnPromptSuccess');

                    }

                    else {

                        myGameInstance.SendMessage('YandexGame', 'OnPromptFail');

                    }

                    window.focus();

                });

        } catch (e) {

            console.error('CRASH Prompt Show: ', e.message);

            window.focus();

        }

    }



    function PaintRBT(rbt) {

        try {

            document.getElementById(rbt).style.background = '#ff0000';

        } catch (e) {

            console.error('CRASH Paint RBT: ', e.message);

        }

    }



    function StaticRBTDeactivate() {

    }



    const gvActions = document.getElementById("gv-hud-actions");

    const gvResetModal = document.getElementById("gv-reset-modal");

    const gvResetError = document.getElementById("gv-reset-error");

    const gvResetConfirm = document.getElementById("gv-reset-confirm");

    function gvSyncActionPosition() {

        if (!gvActions || !canvas) return;

        const r = canvas.getBoundingClientRect();

        if (!r.width || !r.height || loadingCover.style.display !== "none") {

            gvActions.style.display = "none";

            return;

        }

        gvActions.style.display = "flex";

        const right = Math.min(window.innerWidth - 5, r.right - 8);

        const bottom = Math.min(window.innerHeight - 5, r.bottom - 8);

        gvActions.style.left = Math.round(Math.max(r.left + 5, right - gvActions.offsetWidth)) + "px";

        gvActions.style.top = Math.round(Math.max(r.top + 5, bottom - gvActions.offsetHeight)) + "px";

    }

    document.getElementById("gv-save-score").addEventListener("click", (e) => {

        e.preventDefault(); e.stopPropagation();

        ArcadeSave.saveScore();

    });

    document.getElementById("gv-reset-data").addEventListener("click", (e) => {

        e.preventDefault(); e.stopPropagation();

        gvResetError.textContent = "";

        gvResetModal.hidden = false;

    });

    document.getElementById("gv-reset-cancel").addEventListener("click", () => {

        gvResetModal.hidden = true;

    });

    gvResetConfirm.addEventListener("click", () => {

        gvResetConfirm.disabled = true;

        gvResetError.textContent = "";

        ArcadeSave.reset().catch((e) => {

            gvResetError.textContent = e.message || "Không thể xóa dữ liệu. Dữ liệu local được giữ nguyên.";

        }).finally(() => { gvResetConfirm.disabled = false; });

    });

    ["resize", "orientationchange", "fullscreenchange", "webkitfullscreenchange"].forEach((name) => {

        window.addEventListener(name, gvSyncActionPosition);

        document.addEventListener(name, gvSyncActionPosition);

    });

    if (window.visualViewport) {

        visualViewport.addEventListener("resize", gvSyncActionPosition);

        visualViewport.addEventListener("scroll", gvSyncActionPosition);

    }

    if (window.ResizeObserver) new ResizeObserver(gvSyncActionPosition).observe(canvas);

    document.body.appendChild(script);

</script>
