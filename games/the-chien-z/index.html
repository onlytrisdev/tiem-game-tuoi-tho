	<script type="text/javascript">
	if (YaGames) 
	{
		YaGames.init(
		{
			screen: 
			{	
			    fullscreen: false
			},
			yandexApp: {
	        	enabled: false
	    	},
			adv: 
			{
		        onAdvClose: wasShown => 
		        {
		            console.info('adv closed!');
		            console.log("Reanude game");
		            cr_setSuspended(false);
		            flgPlay = true;flgRPlay = true;
		        }
		    }
		}).then(function (ysdk) 
		{
			window.ysdk = ysdk;
		});
	}


	function closeAdsYandex()
	{
		console.log("");
	}

	function showAds()
	{

		console.log("Show Ads Yandex");
		////////////////////////////////////////////////
		try 
		{
			////////////////////////////////////////////////
			ysdk.adv.showFullscreenAdv(
			{
				callbacks: 
				{
					onClose: function(wasShown){  console.log("Close Ads Yandex : "+wasShown);flgPlay = true;flgRPlay = true;},
					onOpen: function(open)
					{ 
						console.log("Open Ads Yandex : "+open);
						cr_setSuspended(true);
						console.log("Prepare Action SDK yandx : ");flgPlay = false;flgRPlay = false; 
					},
					onError: function(error){ console.log("Error Ads Yandex : "+error);flgPlay = true;flgRPlay = true; },
					onOffline: function(offline){ console.log("Offline Ads Yandex : "+offline);flgPlay = true;flgRPlay = true; }
				}
			});
		}
		catch(err) 
		{
			console.log("Reanude game for Ads Error");
			flgPlay = true;flgRPlay = true;
		}
		////////////////////////////////////////////////
	}
