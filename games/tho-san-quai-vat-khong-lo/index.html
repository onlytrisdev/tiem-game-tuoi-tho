<!DOCTYPE html>

<html lang="en">

<head><script src="../../assets/vendor/clean-runtime.js?v=4"></script>

	<meta charset="utf-8"/>

	<title>Billy</title>



	<script src="libs/easeljs-0.8.2.min.js"></script>

	<script src="libs/tweenjs-0.6.2.min.js"></script>

	<script src="libs/preloadjs-0.6.2.min.js"></script>

	<script src="libs/soundjs-0.6.2.min.js"></script>

	<script src="libs/keymaster.js"></script>

	<![if !IE]><script src="libs/Font.js"></script><![endif]>

	<script src="main.js"></script>

	<style>

		html,body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

	</style>

	<style>

		@font-face {

			font-family: 'Digitalt';

			src: url('fonts/Digitalt.eot') format('embedded-opentype');

			src: url('fonts/Digitalt.woff2') format('woff2'),

				 url('fonts/Digitalt.woff') format('woff'),

				 url('fonts/Digitalt.ttf') format('truetype'),

				 url('fonts/Digitalt.svg') format('svg');

			font-weight: normal;

			font-style: normal;

		}

	</style>

		

	<meta name="description" content="" />



	<script>

	var canvas, stage, exportRoot;



	function initNotIe() {

		var fonts = [

			["Digitalt", "fonts/Digitalt.ttf"]

		];



		var numFonts = fonts.length;

		var loadedFonts = 0;

		if(numFonts == 0)

		{

			initGame();

		}

		else {

			for (var i = 0; i < numFonts; i++)

			{

				var fontToLoad = new Font();

				fontToLoad.fontFamily = fonts[i][0];

				fontToLoad.src = fonts[i][1];

				fontToLoad.onload = function ()

				{

				  loadedFonts++;

				  console.log("font " + loadedFonts + " loaded");

				  if(loadedFonts == numFonts)

				  {

					initGame();

				  }

				}

			}

		}

	}



	function detectAndInit()

	{

		var isIE = /Trident/.test(navigator.userAgent);

		console.log("navigator.userAgent: " + navigator.userAgent);

		console.log("isIE: " + isIE);

		if(isIE)

		{

			initIe();

		}

		else

		{

			initNotIe();

		}

	}



	function initIe() {

		initGame();

	}



	function initGame() {

			Main.init();

	}

	</script>

</head>

<body>

		<body onload="detectAndInit();" style="background-color:#D4D4D4">

			<canvas id="canvas" width="750" height="500" style="background-color:#72D7EE;position: absolute; left: 0; top: 0; z-index: 0;"></canvas>

			<canvas id="ui" width="750" height="500" style="position: absolute; left: 0; top: 0; z-index: 1;"></canvas>

		
</body>



</body>

</html>
