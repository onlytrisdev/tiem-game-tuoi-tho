<html>
<head>
  <meta charset="utf-8">

  <title>Thời trang bạn gái</title>
  
  <script src="../../assets/vendor/clean-runtime.js?v=4"></script>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->
  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- force webkit on 360 -->
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <!-- force edge on IE -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">

  <!-- force full screen on some browser -->
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  
  <!-- force screen orientation on some browser -->
  <meta name="screen-orientation" content=""/>
  <meta name="x5-orientation" content="">

  <!--fix fireball/issues/3568 -->
  <!--<meta name="browsermode" content="application">-->
  <meta name="x5-page-mode" content="app">

  <link rel="stylesheet" type="text/css" href="style-mobile.25fc5.css"/>
  <link rel="icon" href="favicon.8de18.ico"/>
  <style>
    #gv-hud-actions {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transform-origin: top right;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      -webkit-touch-callout: none;
    }
    #gv-hud-actions button {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 6px;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: transform 0.22s ease;
      transform: translateY(0);
    }
    #gv-hud-actions button:hover { transform: translateY(-5px); }
    #gv-hud-actions button:active { transform: translateY(-2px); opacity: 0.9; }
    #gv-hud-actions img {
      width: 70px;
      height: 60px;
      display: block;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes">
      <span style="width: 0%"></span>
    </div>
  </div>

  <div id="gv-hud-actions">
    <button type="button" id="gv-send-score-btn" title="Gửi điểm" aria-label="Gửi điểm">
      <img src="save-score.png" alt="" width="70" height="60" draggable="false">
    </button>
    <button type="button" id="gv-reset-data-btn" title="Xóa dữ liệu" aria-label="Xóa dữ liệu">
      <img src="reset-data.png" alt="" width="70" height="60" draggable="false">
    </button>
  </div>

<script src="src/settings.bcf95.js" charset="utf-8"></script>
<script src="arcade-save.js?1" charset="utf-8"></script>
<script src="main.4d64c.js" charset="utf-8"></script>

<script type="text/javascript">
(function () {
    if (typeof VConsole !== 'undefined') {
        window.vConsole = new VConsole();
    }

    var debug = window._CCSettings.debug;
    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    function startGame() {
        if (typeof window.boot === "function") {
            window.boot();
        }
    }

    function bootAfterCloud() {
        if (window.ArcadeSave && typeof window.ArcadeSave.init === "function") {
            window.ArcadeSave.init().then(startGame, startGame);
        } else {
            startGame();
        }
    }

    function loadScript (moduleName, cb) {
      function scriptLoaded () {
          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
      };
      var domScript = document.createElement('script');
      domScript.async = true;
      domScript.src = moduleName;
      domScript.addEventListener('load', scriptLoaded, false);
      document.body.appendChild(domScript);
    }

    loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.cb41c.js', function () {
      if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
        loadScript(debug ? 'physics.js' : 'physics-min.js', bootAfterCloud);
      }
      else {
        bootAfterCloud();
      }
    });
})();
</script>

</body>
</html>
