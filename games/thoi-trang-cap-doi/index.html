	function createImage() {

	    	window.setTimeout(function() {

				var img = this.game.stage.canvas.toDataURL("image/octet-stream");

				window.location.href = img;

            }, 1000);	

	}

	

	function printPage() {

		window.setTimeout(function() {

		var dataUrl = this.game.stage.canvas.toDataURL("image/png");

	

		var windowContent = '<!DOCTYPE html>';

   	 	windowContent += '<html>'

   		windowContent += '<head><title>Print canvas</title></head>';

    	windowContent += '<body>'

    	windowContent += '<img src="' + dataUrl + '">';

    	windowContent += '</body>';

    	windowContent += '</html>';

    

		var printWin = window.open();

    	var printWinDoc = printWin.document;

    	printWinDoc.write(windowContent);

    	printWinDoc.close();

	

    	printWin.focus();

    	printWin.print();

    	printWin.close();

		

		showState.printBtn.visible = true;

    	showState.saveBtn.visible = true;

    	showState.backBtn.visible = true;

		}, 1000);	

	}

	

	function addMoreGames() {

		 var link = document.createElement('a');

   		 // Creates a link element    

   		 // assign the outgoing click     

   		  link.href = "http://localhost";

//window.open("http://localhost");

   		 link.onclick = buttonProperties.action;

   		 link.ontouchend = buttonProperties.action;

   		 link.setAttribute("id", "spilgames-more-games-btn");

		link.setAttribute("target", "_blank");

    	// Adds the element to the document

   		 document.body.appendChild(link);

	}

	

	function removeMoreGames() {

		 var link = document.getElementById("spilgames-more-games-btn");

		 document.body.removeChild(link);

	}

	

	function stopMusic(){

		game.audio.mute=true;	

	}

	

	function toggleMusic(){

		if(oldaudio)

		{game.audio.mute=false;}

		else 

		{game.audio.mute=true;}

		

	}
