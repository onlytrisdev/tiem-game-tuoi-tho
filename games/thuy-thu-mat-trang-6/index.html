<script type="text/javascript">



    var saveFile = function(data, filename){

        var save_link = document.createElementNS('http://www.w3.org/1999/xhtml', 'a');

        save_link.href = data;

        save_link.download = filename;



        var event = document.createEvent('MouseEvents');

        event.initMouseEvent('click', true, false, window, 0, 0, 0, 0, 0, false, false, false, false, 0, null);

        save_link.dispatchEvent(event);

    };



    function saveFun(){



        

        document.getElementById("music").style.display="none";

        document.getElementById("replay").style.display="none";

        document.getElementById("MG3").style.display="none";



        html2canvas(document.body, {

            height:window.screen.availHeight,

            width:7*window.screen.availHeight/5,

            onrendered: function(canvas) {



                //alert(eval('Third_Page'));

                //var canvas_height = canvas.height;



                var explorer =  document.all ? 'IE' : 'others';



                if(explorer=='IE'){

                    //alert(1);

                    try{

                        var img    = canvas.toDataURL("image/png");

                        //img="http://www.baidufe.com/fe/blog/static/img/fe-128.png?v=04657412";

                        var k = window.open();

                        k.document.write('<img src="'+img+'" />');

                        k.document.close();

                    }catch(err){

                        cc.log("[error] - save() - "+ err);

                        //alert(err);

                    }

                }else{

                    var img = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");

                    window.win = open (img);

                    var type="png";

                    // ���غ��������

                    var filename = 'MagicalMix_' + (new Date()).getTime() + '.' + type;

                    // download

                    saveFile(img,filename);

                }



            },

        });

        //});
