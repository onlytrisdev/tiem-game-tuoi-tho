<!DOCTYPE html>

<html lang="en-us">



	<head>

		<meta charset="utf-8">

		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

		<title>Trại sống sót</title>

		<script src="../../assets/vendor/clean-runtime.js?v=4"></script>

		<!-- <script type="text/javascript">document.domain = '7k7k.com'</script> -->

		<style>

			html,

			body {

				background: #000;

				width: 100%;

				height: 100%;

				overflow: visible;

				padding: 0;

				margin: 0;

			}



			div#gameContainer {

				background: transparent !important;

				position: absolute;

			}



			div#gameContainer canvas {

				position: absolute;

			}



			div#gameContainer canvas[data-pixel-art="true"] {

				position: absolute;

				image-rendering: optimizeSpeed;

				image-rendering: -webkit-crisp-edges;

				image-rendering: -moz-crisp-edges;

				image-rendering: -o-crisp-edges;

				image-rendering: crisp-edges;

				image-rendering: -webkit-optimize-contrast;

				image-rendering: optimize-contrast;

				image-rendering: pixelated;

				-ms-interpolation-mode: nearest-neighbor;

			}

		</style>

	</head>



	<body>

		<div id="gameContainer">

			<canvas id="unity-canvas" data-pixel-art=""></canvas>

			<script src="Build/Zombie Survival.loader.js"></script>

            <script src="arcade-save.js?v=trai3"></script>

			<script>

				var canvas = document.querySelector("#unity-canvas");

				var config = {

					dataUrl: "Build/befac150b72674e5fe16ca11a53e1d22.data.unityweb",

					frameworkUrl: "Build/8cd9999418ce3db19e9395794ce5ec42.js.unityweb",

					codeUrl: "Build/15f66c6197c22200db769cbe90c807cd.wasm.unityweb",

					streamingAssetsUrl: "StreamingAssets",

					companyName: "Salted Caramel",

					productName: "Hyper Survive 3D",

					productVersion: "1.8",

				};

				var scaleToFit;

				try

				{

					scaleToFit = !!JSON.parse("");

				} catch (e)

				{

					scaleToFit = true;

				}

				function progressHandler(progress) {

					var percent = progress * 100 + '%';

					canvas.style.background = 'linear-gradient(to right, white, white ' + percent + ', transparent ' + percent + ', transparent) no-repeat center';

					canvas.style.backgroundSize = '100% 1rem';

				}

				function onResize() {

					var container = canvas.parentElement;

					var w;

					var h;



					if (scaleToFit)

					{

						w = window.innerWidth;

						h = window.innerHeight;



						var r = 600 / 960;



						if (w * r > window.innerHeight)

						{

							w = Math.min(w, Math.ceil(h / r));

						}

						h = Math.floor(w * r);

					} else

					{

						w = 960;

						h = 600;

					}



					container.style.width = canvas.style.width = w + "px";

					container.style.height = canvas.style.height = h + "px";

					container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";

					container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";

				}

				var unityStarted = false;

                window.__gvUnityBooted = false;

                function bootUnity() {

                    if (unityStarted) return;

                    unityStarted = true;

                    window.__gvUnityBooted = true;

                    createUnityInstance(canvas, config, progressHandler).then(function (instance) {

                        canvas = instance.Module.canvas;

                        onResize();

                        ArcadeSave.start();

                    }).catch(function (error) {

                        console.error("GV_UNITY_BOOT_FAIL", error);

                    });

                }

                // A hard watchdog cannot overtake the ordinary cloud load/IDB seed path.

                // If the seed finishes late, the adapter requests at most one reload.

                var gvWatchdog = setTimeout(function () {

                    console.warn("GV_BOOT_WATCHDOG");

                    bootUnity();

                }, 13500);

                ArcadeSave.init().catch(function (error) {

                    console.warn("GV_INIT_FAIL", error);

                }).finally(function () {

                    clearTimeout(gvWatchdog);

                    bootUnity();

                });

				window.addEventListener('resize', onResize);

				onResize();



				if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent))

				{

					// Mobile device style: fill the whole browser client area with the game canvas:

					const meta = document.createElement('meta');

					meta.name = 'viewport';

					meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';

					document.getElementsByTagName('head')[0].appendChild(meta);

				}

			</script>

		</div>

	</body>



</html>
