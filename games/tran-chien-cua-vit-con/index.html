<script>

(function () {

  var DW = 750, DH = 1334, MAXH = 1626;

  var lastW = -1, lastH = -1, fitting = false;

  function fit(fromResize) {

    if (fitting) return;

    var el = document.getElementById("GameDiv");

    if (!el) return;

    var ww = window.innerWidth || document.documentElement.clientWidth;

    var wh = window.innerHeight || document.documentElement.clientHeight;

    if (ww < 1 || wh < 1) return;

    var minA = DW / MAXH, maxA = DW / DH, a = ww / wh;

    var w, h;

    if (a > maxA) {

      h = wh;

      w = Math.floor(h * DW / DH);

      if (w > ww) { w = ww; h = Math.floor(w * DH / DW); }

    } else if (a < minA) {

      w = ww;

      h = Math.floor(w * MAXH / DW);

      if (h > wh) { h = wh; w = Math.floor(h * DW / MAXH); }

    } else {

      w = ww;

      h = wh;

    }

    el.style.position = "absolute";

    el.style.left = Math.floor((ww - w) / 2) + "px";

    el.style.top = Math.floor((wh - h) / 2) + "px";

    el.style.width = w + "px";

    el.style.height = h + "px";

    el.style.margin = "0";

    el.style.transform = "none";

    if (w === lastW && h === lastH) return;

    lastW = w;

    lastH = h;

    if (fromResize) return;

    fitting = true;

    try { window.dispatchEvent(new Event("resize")); } catch (err) {}

    fitting = false;

  }

  window.__fitGameDiv = fit;

  fit();

  window.addEventListener("resize", function () { fit(true); });

  [50, 200, 800, 2000].forEach(function (t) { window.setTimeout(function () { fit(); }, t); });

})();

</script>
