<script>
(function () {
  function startGame() {
    System.import('./index.js').catch(function (err) {
      console.error(err);
    });
  }

  var boot =
    window.ArcadeSave && typeof window.ArcadeSave.bootBeforeGame === 'function'
      ? window.ArcadeSave.bootBeforeGame()
      : Promise.resolve();

  boot.then(startGame).catch(function (err) {
    console.warn('[Arcade] boot sync failed, starting local', err);
    startGame();
  });
})();
</script>
