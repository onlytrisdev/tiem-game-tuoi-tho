<!DOCTYPE html>

<html lang="en-us">



<head>

	<meta charset="utf-8">

	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

	<title>Tư thế ẩn nấp 2</title>

	<script src="../../assets/vendor/clean-runtime.js?v=4"></script>

	<script src="arcade-save.js?2"></script>

	<style>

		html,

		body {

			background: #000;

			width: 100%;

			height: 100%;

			overflow: visible;

			padding: 0;

			margin: 0;

		}



		div#gameContainer {

			background: transparent !important;

			position: absolute;

		}



		div#gameContainer canvas {

			position: absolute;

		}



		div#gameContainer canvas[data-pixel-art="true"] {

			position: absolute;

			image-rendering: optimizeSpeed;

			image-rendering: -webkit-crisp-edges;

			image-rendering: -moz-crisp-edges;

			image-rendering: -o-crisp-edges;

			image-rendering: crisp-edges;

			image-rendering: -webkit-optimize-contrast;

			image-rendering: optimize-contrast;

			image-rendering: pixelated;

			-ms-interpolation-mode: nearest-neighbor;

		}

	</style>

	<!-- CustomStyle  -->

	<style>

	#unity-logo {

    	text-align: center;

		margin-top: 25%;

		margin-right: 12.5%;

	}

	#unity-logo img {

		max-width: 60%;

	}

	</style>

</head>



<body>

	<div id="gameContainer">

		<canvas id="unity-canvas" data-pixel-art=""></canvas>

	    <div id="unity-logo"><img src="logo.png"></div>

		<script src="Build/BuildLikeMaster.loader.js"></script>

		<script>

			var canvas = document.querySelector("#unity-canvas");

			var config = {

				dataUrl: "Build/7e77b094cadb470127e183daa2201ca3.data",

				frameworkUrl: "Build/61a39d1cdeac8600fb7a924e493e7510.js",

				codeUrl: "Build/6267d6689dd909a7060f4bf78dc59ca3.wasm",

				streamingAssetsUrl: "StreamingAssets",

				companyName: "beezee",

				productName: "PoseToHide",

				productVersion: "1.0",

			};

			var scaleToFit;

			try {

				scaleToFit = !!JSON.parse("true");

			} catch (e) {

				scaleToFit = true;

			}

			var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

			var gvdpr = new URLSearchParams(location.search).get("gvdpr");

			if (gvdpr) {

				config.devicePixelRatio = Number(gvdpr) || 1;

			} else if (isMobile) {

				config.devicePixelRatio = 1;

			}

			function progressHandler(progress) {

				var percent = progress * 100 + '%';

				canvas.style.background = 'linear-gradient(to right, red, orange ' + percent + ', transparent ' + percent + ', transparent) no-repeat center';

				canvas.style.backgroundSize = '100% 1rem';

			}

			function onResize() {

				var container = canvas.parentElement;

				var w;

				var h;



				if (scaleToFit) {

					w = window.innerWidth;

					h = window.innerHeight;



					var r = 1920 / 1080;



					if (w * r > window.innerHeight) {

						w = Math.min(w, Math.ceil(h / r));

					}

					h = Math.floor(w * r);

				} else {

					w = 1080;

					h = 1920;

				}

				container.style.width = canvas.style.width = w + "px";

				container.style.height = canvas.style.height = h + "px";

				container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";

				container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";

			}



			function hideUnityLogo() {

				var logo = document.getElementById("unity-logo");

				if (logo) logo.style.display = "none";

			}



			function isGvUiEvent(event) {

				return !!(event.target && event.target.closest &&

					event.target.closest("#gv-hud-actions, #gv-reset-modal, #gv-debug-log"));

			}



			function FocusGame() {

				window.focus();

				if (canvas && canvas.focus) canvas.focus();

			}



			window.addEventListener("pointerdown", function (event) {

				if (isGvUiEvent(event)) return;

				FocusGame();

			});



			var booted = false;

			function bootUnity() {

				if (booted) return;

				booted = true;

				createUnityInstance(canvas, config, progressHandler).then(function (instance) {

					window.unityInstance = instance;

					window.myGameInstance = instance;

					canvas = instance.Module.canvas;

					hideUnityLogo();

					onResize();

				});

			}



			if (window.ArcadeSave && typeof ArcadeSave.init === "function") {

				setTimeout(bootUnity, 3000);

				ArcadeSave.init().then(bootUnity, bootUnity);

			} else {

				bootUnity();

			}



			window.addEventListener('resize', onResize);

			onResize();



			if (isMobile) {

				const meta = document.createElement('meta');

				meta.name = 'viewport';

				meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';

				document.getElementsByTagName('head')[0].appendChild(meta);

			}

		</script>

	</div>

</body>



</html>
