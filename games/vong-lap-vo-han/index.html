<script src="../../assets/vendor/clean-runtime.js?v=4"></script>
<script>

let gameOverEvent = new CustomEvent("gameOverAd");
let isGameOverAdShown = 0;

YaGames.init({
				adv: {
						onAdvClose: wasShown => {
									console.info('adv closed!');
						}
				}
		})
		.then(ysdk => {
			ysdk.adv.showFullscreenAdv();


			let commonCounter = 0;
			document.addEventListener('gameOverAd', () => {
				let counter = 0;

				function getCallback(callbackName) {
						return () => {
								counter += 1;
								commonCounter += 1;

								console.log(`showFullscreenAdv; callback ${callbackName}; ${counter} call`);
						}
				}

				ysdk.adv.showFullscreenAdv({
						callbacks: {
								onClose: getCallback('onClose'),
								onOpen: getCallback('onOpen'),
								onError: getCallback('onError'),
								onOffline: getCallback('onOffline')
						}
				});

		});
	});
</script>
